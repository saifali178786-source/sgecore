
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | SGE Core</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #07111f;
      color: #f5f7fb;
    }

    .register-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 50px 20px;
    }

    .register-card {
      width: 100%;
      max-width: 460px;
      box-sizing: border-box;
      padding: 36px;
      border: 1px solid rgba(217, 180, 93, .35);
      border-radius: 8px;
      background: #0d1a2b;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    }

    .register-brand {
      display: inline-block;
      margin-bottom: 24px;
      color: #d9b45d;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .register-card h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .register-intro {
      margin-bottom: 24px;
      color: #aeb9ca;
      line-height: 1.6;
    }

    .register-card label {
      display: block;
      margin: 16px 0 8px;
      color: #e8edf5;
    }

    .register-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #344359;
      border-radius: 4px;
      background: #07111f;
      color: #fff;
      font: inherit;
    }

    .register-card input:focus {
      outline: 2px solid #d9b45d;
      outline-offset: 2px;
    }

    .register-submit {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 4px;
      background: #d9b45d;
      color: #07111f;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .register-submit:hover {
      background: #f0d58c;
    }

    .register-submit:disabled {
      cursor: wait;
      opacity: .7;
    }

    .register-note {
      margin-top: 22px;
      text-align: center;
      color: #aeb9ca;
      line-height: 1.9;
    }

    .register-note a {
      color: #f0d58c;
    }

    .register-message {
      color: #f0d58c;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      .register-card {
        padding: 25px 20px;
      }
    }
  </style>
</head>
<body>
  <main class="register-wrap">
    <section class="register-card">
      <a class="register-brand" href="../index.html">SGE CORE</a>

      <h1>Create Account</h1>
      <p class="register-intro">
        Create your SGE Core account to get started.
      </p>

      <form id="register-form">
        <label for="full-name">Full Name</label>
        <input
          type="text"
          id="full-name"
          name="full-name"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >

        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Create Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="At least 8 characters"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Re-enter your password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button class="register-submit" id="register-submit" type="submit">
          Create Account
        </button>

        <p class="register-message" id="register-message" role="status" aria-live="polite"></p>
      </form>

      <div class="register-note">
        Already have an account?
        <a href="login.html">Login here</a>
        <br>
        <a href="../index.html">← Back to homepage</a>
      </div>
    </section>
  </main>

  <!-- Load the Supabase browser library first -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your local Supabase connection -->
  <script src="../js/supabase.js"></script>

  <script>
    const form = document.getElementById("register-form");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirm-password");
    const message = document.getElementById("register-message");
    const submitButton = document.getElementById("register-submit");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      message.textContent = "";

      if (password.value !== confirmPassword.value) {
        message.textContent = "Your passwords do not match. Please try again.";
        confirmPassword.focus();
        return;
      }

      if (password.value.length < 8) {
        message.textContent = "Your password must contain at least 8 characters.";
        password.focus();
        return;
      }

      if (
        typeof sgecoreSupabase === "undefined" ||
        !sgecoreSupabase.auth
      ) {
        message.textContent =
          "Supabase could not be loaded. Check js/supabase.js and your internet connection.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating account...";

      try {
        const fullName = document.getElementById("full-name").value.trim();
        const email = document.getElementById("email").value.trim();

        const { data, error } = await sgecoreSupabase.auth.signUp({
          email: email,
          password: password.value,
          options: {
            data: {
              full_name: fullName
            }
          }
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

        if (data.user && !data.session) {
          message.textContent =
            "Account created. Please check your email to confirm your account before logging in.";
        } else if (data.user) {
          message.textContent =
            "Account created successfully! You can now log in.";
        } else {
          message.textContent =
            "Registration was submitted. Check your email for next steps.";
        }

        form.reset();
      } catch (error) {
        console.error("Registration error:", error);
        message.textContent =
          "Could not connect to Supabase. Check your internet connection and project settings.";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
