
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | SGE Core</title>
  <link rel="stylesheet" href="../css/style.css">

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      background: #07111f;
      color: #f5f7fb;
      font-family: Arial, sans-serif;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 6%;
      border-bottom: 1px solid rgba(217, 180, 93, .25);
      background: #0d1a2b;
    }

    .dashboard-brand {
      color: #d9b45d;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .logout-button {
      padding: 10px 18px;
      border: 1px solid #d9b45d;
      border-radius: 4px;
      background: transparent;
      color: #f0d58c;
      font-size: 14px;
      cursor: pointer;
    }

    .logout-button:hover {
      background: #d9b45d;
      color: #07111f;
    }

    .dashboard-main {
      width: min(1000px, 88%);
      margin: 55px auto;
    }

    .welcome-card {
      padding: 35px;
      border: 1px solid rgba(217, 180, 93, .35);
      border-radius: 8px;
      background: #0d1a2b;
    }

    .welcome-card h1 {
      margin-top: 0;
      font-size: clamp(28px, 4vw, 40px);
    }

    .welcome-card h1 span {
      color: #d9b45d;
    }

    .dashboard-description {
      color: #aeb9ca;
      line-height: 1.7;
    }

    .account-card {
      margin-top: 25px;
      padding: 25px;
      border: 1px solid #344359;
      border-radius: 8px;
      background: #0d1a2b;
    }

    .account-card h2 {
      margin-top: 0;
      color: #f0d58c;
      font-size: 20px;
    }

    .account-email {
      overflow-wrap: anywhere;
      color: #e8edf5;
    }

    .dashboard-status {
      color: #f0d58c;
      line-height: 1.6;
    }

    .dashboard-footer {
      padding: 25px;
      text-align: center;
      color: #8e9bad;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .dashboard-header {
        padding: 18px 5%;
      }

      .dashboard-brand {
        font-size: 17px;
      }

      .welcome-card {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>
  <header class="dashboard-header">
    <a class="dashboard-brand" href="../index.html">SGE CORE</a>
    <button class="logout-button" id="logout-button" type="button">
      Logout
    </button>
  </header>

  <main class="dashboard-main">
    <section class="welcome-card">
      <h1>Welcome to <span>SGE Core</span></h1>
      <p class="dashboard-description">
        Your account dashboard is ready. This is your starting point
        for accessing SGE Core services.
      </p>
      <p class="dashboard-status" id="dashboard-status" role="status"
         aria-live="polite">
        Checking your account...
      </p>
    </section>

    <section class="account-card">
      <h2>My Account</h2>
      <p><strong>Full Name:</strong> <span id="account-name">Loading...</span></p>
      <p><strong>Email:</strong> <span class="account-email" id="account-email">Loading...</span></p>
    </section>
  </main>

  <footer class="dashboard-footer">
    © SGE Core. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <script>
    const statusMessage = document.getElementById("dashboard-status");
    const accountName = document.getElementById("account-name");
    const accountEmail = document.getElementById("account-email");
    const logoutButton = document.getElementById("logout-button");

    async function loadDashboard() {
      if (
        typeof sgecoreSupabase === "undefined" ||
        !sgecoreSupabase.auth
      ) {
        statusMessage.textContent =
          "Supabase could not load. Check your connection and try again.";
        return;
      }

      try {
        const { data, error } =
          await sgecoreSupabase.auth.getUser();

        if (error || !data.user) {
          window.location.replace("login.html");
          return;
        }

        const user = data.user;
        const fullName = user.user_metadata?.full_name;

        accountName.textContent =
          fullName || "SGE Core Member";

        accountEmail.textContent = user.email || "Not available";

        statusMessage.textContent =
          "You are signed in. Your account has been verified.";
      } catch (error) {
        console.error("Dashboard error:", error);
        statusMessage.textContent =
          "Unable to verify your session. Please try again.";
      }
    }

    logoutButton.addEventListener("click", async function() {
      logoutButton.disabled = true;
      logoutButton.textContent = "Logging out...";

      try {
        const { error } = await sgecoreSupabase.auth.signOut();

        if (error) {
          statusMessage.textContent =
            "Logout failed: " + error.message;
          logoutButton.disabled = false;
          logoutButton.textContent = "Logout";
          return;
        }

        window.location.replace("login.html");
      } catch (error) {
        console.error("Logout error:", error);
        statusMessage.textContent =
          "Unable to log out. Please try again.";
        logoutButton.disabled = false;
        logoutButton.textContent = "Logout";
      }
    });

    loadDashboard();
  </script>
</body>
</html>
