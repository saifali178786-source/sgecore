  nameInput.style.flex = "1";
  nameInput.style.minWidth = "180px";

  const colorInput = el("input");
  colorInput.type = "color";
  colorInput.value = "#d9b45b";
  colorInput.style.width = "65px";
  colorInput.style.height = "42px";
  colorInput.style.padding = "4px";

  const createStatus = el("div", "", "message");

  const createButton = button(
    "Create and assign",
    async () => {
      const name = nameInput.value.trim();

      if (!name) {
        createStatus.textContent = "Enter a label name.";
        createStatus.className = "message error";
        return;
      }

      createButton.disabled = true;
      createStatus.textContent = "Creating label...";
      createStatus.className = "message";

      try {
        const { data, error } = await sgecoreSupabase
          .from("support_customer_labels")
          .insert({
            name,
            color: colorInput.value,
            created_by: state.user.id
          })
          .select("id")
          .single();

        if (error) throw error;

        const { error: assignError } = await sgecoreSupabase
          .from("support_customer_label_members")
          .insert({
            label_id: data.id,
            user_id: ticket.user_id
          });

        if (assignError) throw assignError;

        message(
          "globalMessage",
          "New label created and assigned to this customer.",
          "success"
        );

        await showTicket(ticket, null, false);

      } catch (e) {
        createStatus.textContent = e.message;
        createStatus.className = "message error";
      } finally {
        createButton.disabled = false;
      }
    },
    "primary"
  );

  createRow.append(nameInput, colorInput, createButton);
  panel.append(createRow, createStatus);

  return panel;
}

const replyForm = el("form", undefined, "support-reply-form");

const reply = el("textarea");
reply.rows = 4;
reply.maxLength = 5000;
reply.placeholder = "Write a reply to the customer...";
reply.style.width = "100%";

const attachLabel = el("label", "Attach image or PDF");
attachLabel.style.cssText =
  "display:block;margin:12px 0 8px;color:#e5c879;font-weight:600;";

const fileInput = el("input");
fileInput.type = "file";
fileInput.accept = ".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf";
fileInput.style.display = "block";
fileInput.style.marginTop = "8px";

attachLabel.append(fileInput);

const send = el("button", "Send reply", "primary");
send.type = "submit";

const uploadStatus = el("div", "", "muted small");
uploadStatus.style.marginTop = "8px";

replyForm.append(reply, attachLabel, send, uploadStatus);

replyForm.addEventListener("submit", async event => {
  event.preventDefault();

  const text = reply.value.trim();
  const file = fileInput.files?.[0] || null;

  if (!text && !file) {
    uploadStatus.textContent = "Write a message or select a file first.";
    return;
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "application/pdf"
  ];

  const maxFileSize = 10 * 1024 * 1024;

  if (file && !allowedTypes.includes(file.type)) {
    uploadStatus.textContent = "Choose a JPG, PNG, WEBP or PDF file.";
    return;
  }

  if (file && file.size > maxFileSize) {
    uploadStatus.textContent = "Maximum attachment size is 10 MB.";
    return;
  }

  send.disabled = true;
  fileInput.disabled = true;
  reply.disabled = true;
  uploadStatus.textContent = "Sending...";

  let uploadedPath = null;

  try {
    if (file) {
      const safeName = file.name
        .replace(/[^a-zA-Z0-9._-]/g, "_")
        .slice(-100);

      uploadedPath =
        ticket.id + "/" + crypto.randomUUID() + "-" + safeName;

      const { error: uploadError } = await sgecoreSupabase.storage
        .from("support-attachments")
        .upload(uploadedPath, file, {
          contentType: file.type,
          upsert: false
        });

      if (uploadError) throw uploadError;
    }

    const { error } = await sgecoreSupabase
      .from("support_messages")
      .insert({
        ticket_id: ticket.id,
        sender_id: state.user.id,
        sender_role: "admin",
        message: text || "Attachment: " + file.name,
        attachment_path: uploadedPath
      });

    if (error) {
      if (uploadedPath) {
        await sgecoreSupabase.storage
          .from("support-attachments")
          .remove([uploadedPath]);
      }

      throw error;
    }

    if (ticket.status === "closed" || ticket.status === "resolved") {
      const update = await sgecoreSupabase
        .from("support_tickets")
        .update({ status: "open" })
        .eq("id", ticket.id);

      if (update.error) throw update.error;

      ticket.status = "open";
    }

    await showTicket(ticket, profile, false);

  } catch (e) {
    uploadStatus.textContent = e.message;
    uploadStatus.className = "message error";

  } finally {
    send.disabled = false;
    fileInput.disabled = false;
    reply.disabled = false;
  }
});

msgBox.append(replyForm);

        const passwordInput = $("loginPassword");
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";
        $("toggleAdminPassword").textContent =
          isHidden ? "Hide Password" : "Show Password";
      });

      $("forgotAdminPassword").addEventListener("click", async () => {
        const email = $("loginEmail").value.trim();

        if (!email) {
          message("loginMessage", "Please enter your admin email address first.", "error");
          $("loginEmail").focus();
          return;
        }

        message("loginMessage", "Sending password recovery email…");

        try {
          const redirectTo = new URL(
            "/pages/reset-password.html",
            window.location.origin
          ).href;

          const { error } = await sgecoreSupabase.auth.resetPasswordForEmail(
            email,
            { redirectTo }
          );

          if (error) throw error;

          message(
            "loginMessage",
            "If this email is registered, a password reset link has been sent. Please check your inbox."
          );
        } catch (error) {
          message(
            "loginMessage",
            error.message || "Unable to send the recovery email.",
            "error"
          );
        }
      });
      $("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        message("loginMessage", "Signing in…");

        try {
          const { data, error } = await sgecoreSupabase.auth.signInWithPassword({
            email: $("loginEmail").value.trim(),
            password: $("loginPassword").value
          });

          if (error) throw error;
          await ensureAdmin(data.user);
          message("loginMessage", "");
          showApp();
          await loadPage("overview");
        } catch (e) {
          message("loginMessage", e.message || "Sign-in failed.", "error");
        }
      });

      $("logoutButton").addEventListener("click", async () => {
        const { error } = await sgecoreSupabase.auth.signOut();
        if (error) {
          message("globalMessage", error.message, "error");
          return;
        }
        state.user = null;
        showLogin();
      });

      $("navigation").addEventListener("click", async (event) => {
        const b = event.target.closest("button[data-page]");
        if (!b) return;
        await loadPage(b.dataset.page);
      });

      $("refreshButton").addEventListener("click", async () => {
        await loadPage(state.page);
      });

      sgecoreSupabase.auth.onAuthStateChange((_event, session) => {
        if (!session) {
          state.user = null;
          showLogin();
        }
      });

      checkSession().catch((e) => {
        showLogin();
        message("loginMessage", e.message || "Unable to check session.", "error");
      });
    })();
