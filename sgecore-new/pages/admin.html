
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDE CORE | Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <style>
    :root {
      --bg: #07111f;
      --panel: #101d30;
      --panel2: #15243a;
      --gold: #d9b45b;
      --gold2: #f0d58a;
      --text: #edf2fa;
      --muted: #9aaac0;
      --border: #293a51;
      --green: #42cf96;
      --red: #ff747d;
      --blue: #79b8ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input, select, textarea { font: inherit; }

    button {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      padding: 10px 13px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { border-color: var(--gold); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #101522;
      font-weight: 700;
    }

    .danger {
      border-color: #7f3944;
      color: #ffabb0;
    }

    input, select, textarea {
      width: 100%;
      color: var(--text);
      background: #091626;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field { margin-bottom: 13px; }
    .hidden { display: none !important; }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 30px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
    }

    .brand {
      color: var(--gold);
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 23px;
    }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .message { margin-top: 12px; font-size: 13px; white-space: pre-wrap; }
    .error { color: var(--red); }
    .success { color: var(--green); }

    .app { min-height: 100vh; }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: rgba(7,17,31,.96);
      border-bottom: 1px solid var(--border);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0,1fr);
      min-height: calc(100vh - 70px);
    }

    aside {
      padding: 18px 12px;
      border-right: 1px solid var(--border);
      background: #091525;
    }

    .nav-button {
      width: 100%;
      text-align: left;
      margin-bottom: 6px;
      background: transparent;
      border-color: transparent;
      color: var(--muted);
    }

    .nav-button.active {
      color: var(--gold2);
      background: #17263b;
      border-color: #4b432e;
    }

    main { padding: 25px; min-width: 0; }

    h1 { font-size: 26px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin: 0 0 16px; }
    h3 { font-size: 15px; margin: 0 0 12px; }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      min-width: 0;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      margin-bottom: 16px;
    }

    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { font-size: 25px; font-weight: 700; margin-top: 12px; overflow-wrap: anywhere; }
    .stat-note { font-size: 12px; color: var(--muted); margin-top: 7px; }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .toolbar input { max-width: 360px; }
    .toolbar select { max-width: 210px; }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 750px;
      font-size: 13px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--gold2);
      background: #142238;
      font-weight: 600;
      white-space: nowrap;
    }

    td { overflow-wrap: anywhere; }
    tr:last-child td { border-bottom: 0; }

    .badge {
      display: inline-block;
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 11px;
      background: #27374c;
      color: #dce6f5;
    }

    .badge.pending, .badge.under_review { color: #ffe09b; background: #4a3a20; }
    .badge.approved, .badge.completed, .badge.active { color: #8de7bc; background: #153c32; }
    .badge.rejected, .badge.failed, .badge.cancelled { color: #ffabb0; background: #48242e; }

    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .actions button { padding: 7px 9px; font-size: 12px; }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 16px;
    }

    .detail-list {
      display: grid;
      grid-template-columns: 140px minmax(0,1fr);
      gap: 9px;
      font-size: 13px;
    }

    .detail-list .key { color: var(--muted); }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    .notice { padding: 12px; border-radius: 8px; background: #17263b; color: var(--muted); font-size: 13px; }
    .notice.warning { border: 1px solid #725c2b; color: #ffe09b; }
    .loading { color: var(--muted); padding: 18px 0; }

    .credit-form {
      max-width: 760px;
    }

    .credit-form .field {
      margin-bottom: 17px;
    }

    .credit-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .confirm-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 16px 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .confirm-row input {
      width: auto;
      margin-top: 2px;
      flex: 0 0 auto;
      accent-color: var(--gold);
    }

    .credit-result {
      overflow-wrap: anywhere;
      line-height: 1.7;
    }

    @media (max-width: 1050px) {
      .grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .layout { grid-template-columns: 180px minmax(0,1fr); }
      main { padding: 18px; }
    }

    @media (max-width: 700px) {
      header { padding: 13px; }
      .layout { grid-template-columns: 1fr; }
      aside {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        padding: 10px;
      }
      .nav-button { width: auto; white-space: nowrap; margin: 0; }
      main { padding: 14px; }
      .grid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; }
      .card { padding: 13px; }
      .stat-value { font-size: 20px; }
      .two-col { grid-template-columns: 1fr; }
      .page-head { flex-direction: column; }
      .detail-list { grid-template-columns: 105px minmax(0,1fr); }
    }
  </style>
</head>

<body>
  <section id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="brand">SDE CORE</div>
      <p class="muted">Administration portal</p>
      <h2>Admin sign in</h2>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
            <button type="button" id="toggleAdminPassword"
              style="background:none;border:0;color:#d9b45d;font-size:13px;cursor:pointer;padding:4px 0;">
              Show Password
            </button>
            <button type="button" id="forgotAdminPassword"
              style="background:none;border:0;color:#d9b45d;font-size:13px;cursor:pointer;padding:4px 0;">
              Forgot Password?
            </button>
          </div>
        </div>
        <button class="primary" style="width:100%" type="submit">Sign in</button>
      </form>
      <div id="loginMessage" class="message"></div>
    </div>
  </section>

  <div id="appScreen" class="app hidden">
    <header>
      <div>
        <div class="brand">SDE CORE</div>
        <div class="muted small">Admin control panel</div>
      </div>
      <div class="header-right">
        <span id="adminEmail" class="muted small"></span>
        <button id="logoutButton">Log out</button>
      </div>
    </header>

    <div class="layout">
      <aside id="navigation">
        <button class="nav-button active" data-page="overview">Overview</button>
        <button class="nav-button" data-page="customers">Customers</button>
        <button class="nav-button" data-page="wallets">Wallets</button>
        <button class="nav-button" data-page="transactions">Transactions</button>
        <button class="nav-button" data-page="deposits">Deposits</button>
        <button class="nav-button" data-page="manualcredit">Manual USDT Credit</button>
        <button class="nav-button" data-page="withdrawals">Withdrawals</button>
        <button class="nav-button" data-page="investments">Investments</button>
        <button class="nav-button" data-page="plans">Investment plans</button>
        <button class="nav-button" data-page="support">Support</button>
        <button class="nav-button" data-page="customerlabels">Customer Labels</button>
        <button class="nav-button" data-page="kyc">KYC Verification</button>
        <button class="nav-button" data-page="teamtrade">Team Trade Control</button>
        <button class="nav-button" data-page="teammanagement">Team Management</button>
        <button class="nav-button" data-page="addresses">Deposit addresses</button>
        <button class="nav-button" data-page="audit">Audit log</button>
      </aside>

      <main>
        <div class="page-head">
          <div>
            <h1 id="pageTitle">Overview</h1>
            <div id="pageSubtitle" class="muted">My platform at a glance.</div>
          </div>
          <button id="refreshButton">Refresh data</button>
        </div>
        <div id="globalMessage" class="message"></div>
        <div id="pageContent"><div class="loading">Loading dashboard…</div></div>
      </main>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const $ = (id) => document.getElementById(id);
      const content = $("pageContent");

      const state = {
  user: null,
  page: "overview",
  cache: {},
  customerQuery: "",
  walletQuery: "",
  depositFilter: "all",
    ticketFilter: "all",
  supportLabelFilter: "all"
};

      const pageInfo = {
        overview: ["Overview", "Your platform at a glance."],
        customers: ["Customers", "Search customer profiles and inspect account details."],
        wallets: ["Wallets", "Inspect customer wallet balances."],
        transactions: ["Transactions", "Review recorded wallet transactions."],
        deposits: ["Deposits", "Review pending deposit requests."],
        manualcredit: ["Manual USDT Credit", "Credit a customer's USDT wallet after verifying payment."],
        withdrawals: ["Withdrawals", "Inspect withdrawal requests. Processing is disabled."],
        investments: ["Investments", "Review customer investments."],
        plans: ["Investment plans", "View active and inactive investment plans."],
        support: ["Support", "Review tickets and their messages."],
        customerlabels: ["Customer Labels", "Create private labels and organize customer accounts."],
        kyc: ["KYC Verification", "Review customer identity verification submissions."],
        teamtrade: ["Team Trade Control", "Manage trading settings for authorized internal team accounts."],
        teammanagement: [
  "Team Management",
  "Create teams, assign team leaders and organize customers."
],
        addresses: ["Deposit addresses", "Inspect configured deposit addresses."],
        audit: ["Audit log", "Review recorded administrative activity."]
      };

      function el(tag, text, className) {
        const node = document.createElement(tag);
        if (text !== undefined && text !== null) node.textContent = String(text);
        if (className) node.className = className;
        return node;
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function message(target, text, type) {
        const node = $(target);
        node.textContent = text || "";
        node.className = "message" + (type ? " " + type : "");
      }

      function money(value, currency = "USDT") {
        const n = Number(value);
        if (!Number.isFinite(n)) return "—";
        return n.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + " " + currency;
      }
function shortId(value) {
  if (value === null || value === undefined || value === "") {
    return "—";
  }

  const text = String(value);

  if (text.length <= 12) return text;

  return text.slice(0, 8) + "..." + text.slice(-4);
}
      function date(value) {
        if (!value) return "—";
        const d = new Date(value);
        return Number.isNaN(d.getTime()) ? "—" : d.toLocaleString();
      }

      async function getMemberIdMap(userIds) {
  const ids = [...new Set((userIds || []).filter(Boolean))];

  if (!ids.length) return new Map();

  const profiles = await query(
    "profiles",
    "id,member_id",
    { in: ["id", ids], limit: 1000 }
  );

  return new Map(
    profiles.map(profile => [
      profile.id,
      profile.member_id || "Member ID unavailable"
    ])
  );
}

function memberIdFor(userId, memberMap) {
  return memberMap?.get(userId) || "Member ID unavailable";
}

      function badge(value) {
        const text = value || "unknown";
        return el("span", text, "badge " + String(text).toLowerCase().replace(/[^a-z0-9_-]/g, ""));
      }

      function button(text, action, className) {
        const b = el("button", text, className || "");
        b.type = "button";
        b.addEventListener("click", action);
        return b;
      }

      function card(label, value, note) {
        const box = el("div", undefined, "card");
        box.append(el("div", label, "stat-label"));
        box.append(el("div", value, "stat-value"));
        if (note) box.append(el("div", note, "stat-note"));
        return box;
      }

      function table(headers, rows, renderRow) {
        const wrap = el("div", undefined, "table-wrap");
        const tbl = el("table");
        const thead = el("thead");
        const hr = el("tr");
        headers.forEach((h) => hr.append(el("th", h)));
        thead.append(hr);
        tbl.append(thead);

        const tbody = el("tbody");
        if (!rows || !rows.length) {
          const row = el("tr");
          const td = el("td", "No records found.");
          td.colSpan = headers.length;
          td.className = "empty";
          row.append(td);
          tbody.append(row);
        } else {
          rows.forEach((row) => tbody.append(renderRow(row)));
        }

        tbl.append(tbody);
        wrap.append(tbl);
        return wrap;
      }

      function tr(cells) {
        const row = el("tr");
        cells.forEach((cell) => {
          const td = el("td");
          if (cell instanceof Node) td.append(cell);
          else td.textContent = cell === undefined || cell === null ? "—" : String(cell);
          row.append(td);
        });
        return row;
      }

      function actions(...buttons) {
        const box = el("div", undefined, "actions");
        buttons.forEach((b) => box.append(b));
        return box;
      }

      function fieldLabel(labelText, value) {
        const wrap = el("div", undefined, "detail-list");
        wrap.append(el("div", labelText, "key"));
        wrap.append(el("div", value === undefined || value === null ? "—" : String(value)));
        return wrap;
      }

      async function query(tableName, select = "*", options = {}) {
        let request = sgecoreSupabase.from(tableName).select(select);
        if (options.order) {
          request = request.order(options.order, {
            ascending: options.ascending === true
          });
        }
        if (options.limit) request = request.limit(options.limit);
        if (options.eq) request = request.eq(options.eq[0], options.eq[1]);
        if (options.ilike) request = request.ilike(options.ilike[0], options.ilike[1]);
        if (options.in) request = request.in(options.in[0], options.in[1]);

        const { data, error } = await request;
        if (error) throw new Error(tableName + ": " + error.message);
        return data || [];
      }

      async function countRows(tableName, options = {}) {
        let request = sgecoreSupabase
          .from(tableName)
          .select("id", { count: "exact", head: true });

        if (options.status) request = request.eq("status", options.status);
        const { count, error } = await request;
        if (error) throw new Error(tableName + ": " + error.message);
        return count || 0;
      }

      async function ensureAdmin(user) {
        if (!user) throw new Error("Please sign in.");

        // The trusted admin claim is set in app_metadata.
        // Database RLS policies and RPC authorization remain the security boundary.
        if (user.app_metadata?.role !== "admin") {
          await sgecoreSupabase.auth.signOut();
          throw new Error("This account does not have the required admin role.");
        }

        state.user = user;
        $("adminEmail").textContent = user.email || "Administrator";
      }

      async function checkSession() {
        const { data, error } = await sgecoreSupabase.auth.getUser();
        if (error) throw error;

        if (!data.user) {
          showLogin();
          return;
        }

        try {
          await ensureAdmin(data.user);
          showApp();
          await loadPage(state.page);
        } catch (e) {
          showLogin();
          message("loginMessage", e.message, "error");
        }
      }

      function showLogin() {
        $("loginScreen").classList.remove("hidden");
        $("appScreen").classList.add("hidden");
      }

      function showApp() {
        $("loginScreen").classList.add("hidden");
        $("appScreen").classList.remove("hidden");
      }

      async function loadPage(page) {
        if (!pageInfo[page]) page = "overview";

        state.page = page;
        state.cache = {};
        $("pageTitle").textContent = pageInfo[page][0];
        $("pageSubtitle").textContent = pageInfo[page][1];
        message("globalMessage", "");
        clear(content);
        content.append(el("div", "Loading " + pageInfo[page][0].toLowerCase() + "…", "loading"));

        document.querySelectorAll(".nav-button").forEach((b) => {
          b.classList.toggle("active", b.dataset.page === page);
        });

        try {
          clear(content);
          switch (page) {
            case "overview": await renderOverview(); break;
            case "customers": await renderCustomers(); break;
            case "wallets": await renderWallets(); break;
            case "transactions": await renderTransactions(); break;
            case "deposits": await renderDeposits(); break;
            case "manualcredit": await renderManualCredit(); break;
            case "withdrawals": await renderWithdrawals(); break;
            case "investments": await renderInvestments(); break;
            case "plans": await renderPlans(); break;
            case "kyc": await renderKyc(); break;
            case "support": await renderSupport(); break;
            case "customerlabels": await renderCustomerLabels(); break;
            case "teamtrade": await renderTeamTrade(); break;
            case "teammanagement": await renderTeamManagement(); break;
            case "addresses": await renderAddresses(); break;
            case "audit": await renderAudit(); break;
            default: content.append(el("div", "Unknown page.", "empty"));
          }
        } catch (e) {
          clear(content);
          const box = el("div", undefined, "card");
          box.append(el("h3", "Could not load this section"));
          box.append(el("p", e.message, "error"));
          box.append(el("p", "Check the table permissions and column names in Supabase. Your customer dashboard has not been changed.", "muted"));
          box.append(button("Try again", () => loadPage(page), "primary"));
          content.append(box);
        }
      }


      
async function renderKyc() {
  const toolbar = el("div", undefined, "toolbar");

  const filter = el("select");
  [
    ["all", "All submissions"],
    ["pending", "Pending"],
    ["approved", "Approved"],
    ["rejected", "Rejected"]
  ].forEach(([value, label]) => {
    const option = el("option", label);
    option.value = value;
    filter.append(option);
  });

  toolbar.append(filter);
  toolbar.append(button("Refresh", () => loadPage("kyc"), "primary"));
  content.append(toolbar);

  content.append(el("div", "Loading KYC submissions...", "loading"));

  const { data: rows, error } = await sgecoreSupabase
    .from("kyc_submissions")
    .select(
      "id,user_id,document_type,document_name,document_path,document_back_path,status,admin_notes,created_at"
    )
    .order("created_at", { ascending: false })
    .limit(300);

  if (error) throw error;

  const memberMap = await getMemberIdMap(
    (rows || []).map(row => row.user_id)
  );

  clear(content);
  content.append(toolbar);

  const list = el("div", undefined, "grid");
  const emptyState = el(
    "div",
    "No KYC submissions found for this status.",
    "empty"
  );

  const visibleRows = rows || [];

  visibleRows.forEach((row) => {
    const panel = el("div", undefined, "card");
    panel.dataset.status = row.status;

    const heading = el(
      "h2",
      row.document_type.replaceAll("_", " ").toUpperCase()
    );
    panel.append(heading);

    const details = [
      ["Customer Member ID", memberIdFor(row.user_id, memberMap)],
      ["Document name", row.document_name],
      ["Document type", row.document_type.replaceAll("_", " ")],
      ["Submitted", new Date(row.created_at).toLocaleString()],
      ["Status", row.status.toUpperCase()]
    ];

    const detailList = el("div", undefined, "detail-list");

    details.forEach(([label, value]) => {
      detailList.append(el("strong", label));
      detailList.append(el("span", value || "—"));
    });

    panel.append(detailList);

    if (row.status === "rejected" && row.admin_notes) {
      const reason = el("div", undefined, "notice warning");
      reason.textContent = "Rejection reason: " + row.admin_notes;
      panel.append(reason);
    }

    
const actions = el("div", undefined, "toolbar");

actions.append(button("View Front Side", async () => {
  const previewWindow = window.open("about:blank", "_blank");

  if (!previewWindow) {
    message("globalMessage", "Please allow pop-ups to view the document.", "error");
    return;
  }

  previewWindow.opener = null;

  try {
    const { data, error } = await sgecoreSupabase
      .storage
      .from("kyc-documents")
      .createSignedUrl(row.document_path, 60);

    if (error) throw error;
    if (!data?.signedUrl) {
      throw new Error("Unable to create front-side document link.");
    }

    previewWindow.location.href = data.signedUrl;
  } catch (e) {
    previewWindow.close();

        let profiles = [];

        try {
          profiles = await query(
            "profiles",
            "id,full_name,email,member_id",
            { order: "created_at", limit: 500 }
          );

          const selectedId = preselectedUserId || "";

          function populateCustomers(filterText = "") {
            const term = filterText.trim().toLowerCase();
            const previousValue = customerSelect.value;
            clear(customerSelect);

            const placeholder = el(
              "option",
              term ? "Select a matching customer…" : "Select a customer…"
            );
            placeholder.value = "";
            customerSelect.append(placeholder);

            const matching = profiles.filter((p) => {
              if (!term) return true;
              return [
                p.full_name,
                p.email,
                p.member_id,
                p.id
              ].some((v) => String(v ?? "").toLowerCase().includes(term));
            });

            matching.forEach((p) => {
              const label = [
                p.full_name || "Unnamed customer",
                p.email || "No email",
                p.member_id ? "Member " + p.member_id : "",
                "ID " + shortId(p.id)
              ].filter(Boolean).join(" · ");

              const option = el("option", label);
              option.value = p.id;
              customerSelect.append(option);
            });

            const desired = selectedId || previousValue;
            if (desired && matching.some((p) => p.id === desired)) {
              customerSelect.value = desired;
            } else {
              customerSelect.value = "";
            }

            if (matching.length === 0) {
              status.textContent = "No matching customers were found in the first 500 profiles returned.";
              status.className = "message error";
            } else if (status.textContent.startsWith("No matching customers")) {
              status.textContent = "";
              status.className = "message";
            }
          }

          populateCustomers();

          customerSearch.addEventListener("input", () => {
            populateCustomers(customerSearch.value);
          });

          customerSelect.addEventListener("change", () => {
            const selected = profiles.find((p) => p.id === customerSelect.value);
            if (selected) {
              status.textContent = "Selected: " +
                (selected.full_name || selected.email || selected.id);
              status.className = "message";
            }
          });

          if (preselectedUserId && !profiles.some((p) => p.id === preselectedUserId)) {
            status.textContent = "The selected customer was not found in the first 500 profiles. Search for the customer or select them manually.";
            status.className = "message error";
          }
        } catch (e) {
          customerSelect.replaceChildren();
          const failedOption = el("option", "Could not load customers");
          failedOption.value = "";
          customerSelect.append(failedOption);
          status.textContent = "Could not load customer profiles: " + e.message;
          status.className = "message error";
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          status.textContent = "";
          status.className = "message";
          clear(resultBox);

          const userId = customerSelect.value;
          const amountText = amountInput.value.trim();
          const amount = Number(amountText);
          const bankReference = referenceInput.value.trim();
          const note = noteInput.value.trim();

          if (!userId) {
            status.textContent = "Please select a customer.";
            status.className = "message error";
            return;
          }

          if (
            !amountText ||
            !Number.isFinite(amount) ||
            amount <= 0 ||
            amount > 1000000000 ||
            Math.round(amount * 1000000) !== amount * 1000000
          ) {
            status.textContent = "Enter a valid positive USDT amount with no more than 6 decimal places.";
            status.className = "message error";
            return;
          }

          if (!bankReference || bankReference.length > 200) {
            status.textContent = "Enter a valid payment reference of up to 200 characters.";
            status.className = "message error";
            return;
          }

          if (!confirmCheckbox.checked) {
            status.textContent = "Confirm that you have verified the payment before continuing.";
            status.className = "message error";
            return;
          }

          const profile = profiles.find((p) => p.id === userId);
          const customerName = profile
            ? (profile.full_name || profile.email || profile.id)
            : userId;

          const confirmation = [
            "CONFIRM REAL USDT CREDIT",
            "",
            "Customer: " + customerName,
            "Customer UUID: " + userId,
            "Amount: " + amount.toFixed(6) + " USDT",
            "Payment reference: " + bankReference,
            "",
            "Have you verified that this payment was actually received?",
            "This action will update the customer's delivery USDT wallet.",
            "Do not continue unless all details are correct."
          ].join("\n");

          if (!confirm(confirmation)) return;

          submit.disabled = true;
          submit.textContent = "Processing…";
          status.textContent = "Submitting the secured database request…";

          try {
            const { data, error } = await sgecoreSupabase.rpc(
              "admin_credit_sge_usdt",
              {
                p_user_id: userId,
                p_amount: amount,
                p_bank_reference: bankReference,
                p_note: note || null
              }
            );

            if (error) throw error;

            if (!data || data.success !== true || !data.credit_id) {
              throw new Error(
                "The database did not return a confirmed credit record. Check the wallet and transaction records before attempting another credit."
              );
            }

            status.textContent = "USDT credit completed successfully.";
            status.className = "message success";

            const successCard = el("div", undefined, "card");
            successCard.append(el("h3", "Credit confirmed"));
            successCard.append(fieldLabel("Customer", customerName));
            successCard.append(fieldLabel("Amount credited", Number(data.amount).toFixed(6) + " USDT"));
            successCard.append(fieldLabel("Credit record ID", data.credit_id));
            successCard.append(fieldLabel("Wallet ID", data.wallet_id));
            successCard.append(fieldLabel("Payment reference", bankReference));
            successCard.append(el(
              "p",
              "The database confirmed the operation. Verify the resulting wallet balance and transaction record as part of your reconciliation process.",
              "muted small"
            ));
            resultBox.append(successCard);

            amountInput.value = "";
            referenceInput.value = "";
            noteInput.value = "";
            confirmCheckbox.checked = false;

            // Keep the selected customer to make subsequent verified entries easier.
            await refreshCreditRelatedData();
          } catch (e) {
            status.textContent =
              "Credit failed: " +
              (e && e.message ? e.message : "Unknown error") +
              "\n\nBefore retrying, check the customer's wallet, transaction history, and payment reference to ensure the operation was not already completed.";
            status.className = "message error";
          } finally {
            submit.disabled = false;
            submit.textContent = "Credit USDT wallet";
          }
        });
      }

        profile.full_name || "Unnamed customer",
        profile.email || "No email"
      ].join(" — ");

      const customerOption = el("option", label);
      customerOption.value = profile.id;
      customerSelect.append(customerOption);
    });

    customerSelect.disabled = matches.length === 0;

    if (!matches.length) {
      const noResults = el("option", "No matching customer found");
      noResults.value = "";
      customerSelect.append(noResults);
    }
  }

  function showCustomerDetails(profile) {
    clear(selectedDetails);

    if (!profile) {
      selectedDetails.textContent = "No customer selected.";
      return;
    }

    selectedDetails.append(el("h3", "Selected Customer"));

    const details = el("div", undefined, "detail-list");

    [
      ["Member ID", profile.member_id || "Member ID unavailable"],
      ["Customer Name", profile.full_name || "Not available"],
      ["Email", profile.email || "Not available"]
    ].forEach(([label, value]) => {
      details.append(el("strong", label));
      details.append(el("span", value));
    });

    selectedDetails.append(details);
  }

  async function loadCustomerTransactions() {
    const profile = profiles.find(
      item => item.id === customerSelect.value
    );

    if (!profile) {
      status.textContent = "Please search for and select a customer.";
      status.className = "message error";
      return;
    }

    showCustomerDetails(profile);

    status.textContent = "Loading customer transactions...";
    status.className = "message";

    resultsBox.replaceChildren(
      el("h2", "Deposit and Withdrawal History"),
      el("div", "Loading transactions...", "loading")
    );

    try {
      const allTransactions = await query(
        "wallet_transactions",
        "id,user_id,wallet_id,transaction_type,amount,currency,status,reference_id,description,created_at",
        {
          eq: ["user_id", profile.id],
          order: "created_at",
          limit: 500
        }
      );

      const transactions = allTransactions.filter(transaction => {
        const type = String(
          transaction.transaction_type || ""
        ).toLowerCase();

        return type.includes("deposit") || type.includes("withdraw");
      });

      const heading = el("h2", "Deposit and Withdrawal History");

      const customerInfo = el(
        "p",
        (profile.member_id || "Member ID unavailable") +
        " · " +
        (profile.full_name || profile.email || "Customer"),
        "muted small"
      );

      const resultTable = table(
        [
          "Date",
          "Member ID",
          "Type",
          "Amount",
          "Status",
          "Description",
          "Reference"
        ],
        transactions,
        transaction => {
          const type = String(
            transaction.transaction_type || ""
          ).toLowerCase();

          const displayType = type.includes("deposit")
            ? "Deposit"
            : "Withdrawal";

          return tr([
            date(transaction.created_at),
            profile.member_id || "Member ID unavailable",
            displayType,
            money(transaction.amount, transaction.currency),
            badge(transaction.status),
            transaction.description || "—",
            transaction.reference_id || "—"
          ]);
        }
      );

      resultsBox.replaceChildren(
        heading,
        customerInfo,
        el(
          "p",
          "Total deposit and withdrawal records: " + transactions.length,
          "muted small"
        ),
        resultTable
      );

      status.textContent = "Customer transaction history loaded.";
      status.className = "message success";

    } catch (e) {
      resultsBox.replaceChildren(
        el("h2", "Deposit and Withdrawal History"),
        el("p", e.message || "Unable to load transactions.", "error")
      );

      status.textContent = "Unable to load customer transactions.";
      status.className = "message error";
    }
  }

  const viewButton = button(
    "View Transactions",
    loadCustomerTransactions,
    "primary"
  );

  const clearButton = button("Clear Search", () => {
    search.value = "";
    updateCustomerResults();
    customerSelect.value = "";
    showCustomerDetails(null);
    status.textContent = "";

    resultsBox.replaceChildren(
      el("h2", "Deposit and Withdrawal History"),
      el("div", "Select a customer to view their transactions.", "empty")
    );
  });

  search.addEventListener("input", () => {
    updateCustomerResults();
    customerSelect.value = "";
    showCustomerDetails(null);
  });

  search.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      event.preventDefault();

      if (customerSelect.options.length === 2) {
        customerSelect.selectedIndex = 1;
        loadCustomerTransactions();
      }
    }
  });

  customerSelect.addEventListener("change", () => {
    const profile = profiles.find(
      item => item.id === customerSelect.value
    );

    showCustomerDetails(profile || null);
  });

  box.append(
    el("label", "Search Customer"),
    search,
    el("label", "Matching Customers"),
    customerSelect,
    selectedDetails,
    viewButton,
    clearButton,
    status
  );

  content.append(box, resultsBox);
}


      
async function renderDeposits() {
  const toolbar = el("div", undefined, "toolbar");

  [
    ["all", "All statuses"],
    ["pending", "Pending"],
    ["under_review", "Under review"],
    ["approved", "Approved"],
    ["rejected", "Rejected"]
  ].forEach(([value, label]) => {
    const opt = el("option", label);
    opt.value = value;
    filter.append(opt);
  });

  filter.value = state.depositFilter;

  filter.addEventListener("change", () => {
    state.depositFilter = filter.value;
    loadPage("deposits");
  });

  toolbar.append(filter);
  content.append(toolbar);

  let rows = await query(
    "deposit_requests",
    "id,deposit_number,user_id,wallet_id,method,currency,network,amount,transaction_hash,payment_reference,receipt_path,status,reviewed_by,reviewed_at,review_note,created_at",
    { order: "created_at", limit: 500 }
  );

  if (state.depositFilter !== "all") {
    rows = rows.filter(d => d.status === state.depositFilter);
  }

  // Load permanent Customer IDs.
  const memberMap = await getMemberIdMap(
    rows.map(d => d.user_id)
  );

  // Load permanent Wallet IDs.
  const walletIds = [
    ...new Set(rows.map(d => d.wallet_id).filter(Boolean))
  ];

  const walletRows = walletIds.length
    ? await query(
        "wallets",
        "id,wallet_number",
        { in: ["id", walletIds], limit: 1000 }
      )
    : [];

  const walletMap = new Map(
    walletRows.map(w => [w.id, w.wallet_number])
  );

  content.append(el(
    "div",
    "Approvals use the existing review_sge_deposit database function. The database checks authorization, request status, duplicate transactions and wallet crediting.",
    "notice"
  ));

  content.append(table(
    [
      "Date",
      "Customer ID",
      "Method / Network",
      "Amount",
      "Reference",
      "Status",
      "Review"
    ],
    rows,
    d => {
      const reviewButtons = [];

      if (["pending", "under_review"].includes(d.status)) {
        reviewButtons.push(
          button("Approve", () => reviewDeposit(d, "approved"), "primary")
        );

        reviewButtons.push(
          button("Reject", () => reviewDeposit(d, "rejected"), "danger")
        );
      }

      reviewButtons.push(
        button(
          "Details",
          () => showDepositDetails(d, memberMap, walletMap)
        )
      );

      return tr([
        date(d.created_at),
        memberIdFor(d.user_id, memberMap),
        [d.method, d.network].filter(Boolean).join(" / "),
        money(d.amount, d.currency),
        d.transaction_hash || d.payment_reference || "—",
        badge(d.status),
        actions(...reviewButtons)
      ]);
    }
  ));
}

      async function reviewDeposit(deposit, decision) {
        const promptText = decision === "approved"
          ? "Approve this deposit? The database function will credit the eligible wallet."
          : "Reject this deposit request?";

        if (!confirm(promptText)) return;

        const note = prompt("Optional review note:", "");
        if (note === null) return;

        const result = await sgecoreSupabase.rpc("review_sge_deposit", {
          p_request_id: deposit.id,
          p_decision: decision,
          p_review_note: note.trim() || null
        });

        if (result.error) {
          message("globalMessage", "Review failed: " + result.error.message, "error");
          return;
        }

        message("globalMessage", "Deposit review completed.", "success");
        await loadPage("deposits");
      }

  listCard.innerHTML = `

const customerMessage = wrapper.querySelector("#sdeCustomerMessage");
const assignedCustomerList = wrapper.querySelector("#sdeAssignedCustomerList");

  let teams = [];
  let profiles = [];
  let customerIds = new Set();
let customerAssignments = [];
let memberships = [];

    select.append(option);

  // LOAD TEAMS, USERS AND MEMBERSHIPS
  async function loadTeams() {
    teamList.textContent = "Loading teams...";

    const [
      teamResult,
      profileResult,
      customerResult,
      memberResult
    ] = await Promise.all([
      sgecoreSupabase.from("teams").select("*"),
      sgecoreSupabase.from("profiles")
        .select("id, full_name, email, member_id"),
      sgecoreSupabase.from("team_customers")
  .select("user_id, team_id"),
      sgecoreSupabase.from("team_members")
        .select("user_id, team_id, member_role, is_active")
    ]);

    const errorResult = [
      teamResult,
      profileResult,
      customerResult,
      memberResult
    ].find(result => result.error);

    if (errorResult) {
      teamList.textContent =
        "Unable to load Team Management data: " +
        errorResult.error.message;
      return;
    }

    teams = (teamResult.data || []).filter(
      team => team.is_active !== false
    );

    profiles = profileResult.data || [];

    customerAssignments = customerResult.data || [];

customerIds = new Set(
  customerAssignments.map(item => item.user_id)
);

    memberships = memberResult.data || [];

    // DISPLAY ASSIGNED CUSTOMERS
    assignedCustomerList.replaceChildren();

    if (!customerAssignments.length) {
      assignedCustomerList.textContent =
        "No customers have been assigned to any team yet.";
    } else {

      const customerHead = document.createElement("thead");

        customerHeaderRow.append(th);
      });

      customerHead.append(customerHeaderRow);
      customerTable.append(customerHead);

      const customerBody = document.createElement("tbody");

      customerAssignments.forEach(assignment => {
        const profile = profiles.find(
          item => item.id === assignment.user_id
        );

        const team = teams.find(
          item => item.id === assignment.team_id
        );

        const row = document.createElement("tr");

        const values = [
          profile?.full_name || "Unknown Customer",
          profile?.email || "No email",
          profile?.member_id || "N/A",
          team?.team_name || "Inactive or unavailable team"
        ];

                values.forEach(value => {
          const td = document.createElement("td");

          td.style.cssText =

          )) {
            return;

              {
                p_team_id: assignment.team_id,
                p_user_id: assignment.user_id

            if (data && data.success === false) {

            }

            alert("Customer removed from the team successfully.");

    }


    // TEAM DROPDOWN
    const previousTeam = teamSelect.value;

    teamSelect.replaceChildren();

    addOption(teamSelect, "", "Select a team");

    teams.forEach(team => {
      addOption(
        teamSelect,
        team.id,

      );
    });

    if (teams.some(team => team.id === previousTeam)) {
      teamSelect.value = previousTeam;
    }

    // TEAM LEADER DROPDOWN
    const previousUser = userSelect.value;

    userSelect.replaceChildren();

    addOption(userSelect, "", "Select a team leader");

    const eligibleProfiles = profiles.filter(profile => {
      if (customerIds.has(profile.id)) return false;

      const membership = memberships.find(
        member => member.user_id === profile.id
      );

      
    // Allow unassigned users and existing team leaders only.
    if (
      membership &&
      membership.member_role !== "team_leader"
    ) {
      return false;
    }

    return true;
  });

  eligibleProfiles.forEach(profile => {

      profile.id,
      `${name} | ${email} | ID: ${memberId}`
    );
  });

  if (
    eligibleProfiles.some(profile => profile.id === previousUser)
  ) {
    userSelect.value = previousUser;
  }

  // CUSTOMER TEAM DROPDOWN
  const previousCustomerTeam = customerTeamSelect.value;

  customerTeamSelect.replaceChildren();
  addOption(customerTeamSelect, "", "Select a team");

  teams.forEach(team => {
    addOption(
      customerTeamSelect,
      team.id,
      team.team_name || "Unnamed Team"
    );
  });

  if (teams.some(team => team.id === previousCustomerTeam)) {
    customerTeamSelect.value = previousCustomerTeam;
  }

  // CUSTOMER USER DROPDOWN
  const previousCustomer = customerUserSelect.value;

  customerUserSelect.replaceChildren();
  addOption(customerUserSelect, "", "Select a customer");

  const activeLeaderIds = new Set(
    memberships
      .filter(member =>
        member.member_role === "team_leader" &&
        member.is_active !== false
      )
      .map(member => member.user_id)
  );

  const eligibleCustomers = profiles.filter(
    profile => !activeLeaderIds.has(profile.id)
  );

  eligibleCustomers.forEach(profile => {
    const name = profile.full_name || "Unnamed Customer";
    const email = profile.email || "No email";
    const memberId = profile.member_id || "N/A";

    const assignment = customerAssignments.find(
      item => item.user_id === profile.id
    );

    const assignedTeam = assignment
      ? teams.find(team => team.id === assignment.team_id)
      : null;

    const assignmentLabel = assignment
      ? ` | Currently assigned: ${assignedTeam?.team_name || "Another team"}`
      : " | Not assigned";

    addOption(
      customerUserSelect,
      profile.id,
      `${name} | ${email} | ID: ${memberId}${assignmentLabel}`
    );
  });

  if (
    eligibleCustomers.some(profile => profile.id === previousCustomer)
  ) {
    customerUserSelect.value = previousCustomer;
  }


    // EXISTING TEAMS TABLE
    if (!teams.length) {
      teamList.textContent = "No active teams have been created yet.";
      return;
    }

    const table = document.createElement("table");
    table.style.cssText =
      "width:100%;border-collapse:collapse;color:#dce5f1;";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

        [
      "Team Name",
      "Description",
      "Team Leader",
      "Team ID",
      "Action"
    ].forEach(label => {
      const th = document.createElement("th");
      th.textContent = label;
      th.style.cssText =
        "padding:12px;text-align:left;border-bottom:1px solid #34445b;color:#f0d58c;";
      headerRow.append(th);
    });

    thead.append(headerRow);
    table.append(thead);

    const tbody = document.createElement("tbody");

    teams.forEach(team => {
      const row = document.createElement("tr");

      const leader = memberships.find(member =>
        member.team_id === team.id &&
        member.member_role === "team_leader" &&
        member.is_active === true
      );

      const leaderProfile = leader
        ? profiles.find(profile => profile.id === leader.user_id)
        : null;

      const leaderName = leaderProfile
        ? `${leaderProfile.full_name || "Unnamed User"} (${leaderProfile.email || "No email"})`
        : "Not assigned";

      const values = [
        team.team_name || "Unnamed Team",
        team.description || "—",
        leaderName,
        team.id || "—"
      ];

            values.forEach(value => {
        const td = document.createElement("td");
        td.textContent = String(value);
        td.style.cssText =
          "padding:12px;border-bottom:1px solid #26364a;overflow-wrap:anywhere;";
        row.append(td);
      });

      // REMOVE TEAM LEADER
      const actionCell = document.createElement("td");
      actionCell.style.cssText =
        "padding:12px;border-bottom:1px solid #26364a;";

      if (leader) {
        const removeLeaderButton = document.createElement("button");
        removeLeaderButton.type = "button";
        removeLeaderButton.textContent = "Remove Leader";
        removeLeaderButton.style.cssText =
          "padding:7px 13px;border:1px solid #d66b6b;border-radius:6px;background:#351c25;color:#ffaaaa;cursor:pointer;font-weight:600;white-space:nowrap;";

        removeLeaderButton.addEventListener("click", async () => {
          const leaderName =
            leaderProfile?.full_name || "this team leader";

          if (!confirm(
            `Remove ${leaderName} as leader of ${team.team_name}?`
          )) {
            return;
          }

          removeLeaderButton.disabled = true;
          removeLeaderButton.textContent = "Removing...";

          try {
            const { data, error } = await sgecoreSupabase.rpc(
              "sde_remove_team_leader",
              {
                p_team_id: team.id,
                p_user_id: leader.user_id
              }
            );

            if (error) throw error;

            if (data && data.success === false) {
              throw new Error("Team leader removal was not completed.");
            }

            alert("Team leader removed successfully.");
            await loadTeams();

          } catch (error) {
            alert("Unable to remove team leader: " + error.message);
            removeLeaderButton.disabled = false;
            removeLeaderButton.textContent = "Remove Leader";
          }
        });

        actionCell.append(removeLeaderButton);
      } else {
        actionCell.textContent = "—";
      }

      row.append(actionCell);
      tbody.append(row);
    });

    table.append(tbody);
    teamList.replaceChildren(table);
  }

  // CREATE TEAM
  createForm.addEventListener("submit", async event => {
    event.preventDefault();

    const teamName =
      wrapper.querySelector("#sdeTeamName").value.trim();

    const description =
      wrapper.querySelector("#sdeTeamDescription").value.trim();

    const submitButton =
      createForm.querySelector('button[type="submit"]');

    if (!teamName) {
      setMessage(createMessage, "Please enter a team name.", false);
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Creating...";
    createMessage.textContent = "";

    try {
      const { error } = await sgecoreSupabase.rpc(
        "sde_create_team",
        {
          p_team_name: teamName,
          p_description: description || null
        }
      );

      if (error) throw error;

      setMessage(createMessage, "Team created successfully.", true);

      createForm.reset();
      await loadTeams();

    } catch (error) {
      setMessage(
        createMessage,
        "Unable to create team: " + error.message,
        false
      );
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Create Team";
    }
  });

  // ASSIGN TEAM LEADER
  leaderForm.addEventListener("submit", async event => {
    event.preventDefault();

    const selectedTeamId = teamSelect.value;
    const selectedUserId = userSelect.value;

    const submitButton =
      leaderForm.querySelector('button[type="submit"]');

    if (!selectedTeamId || !selectedUserId) {
      setMessage(
        leaderMessage,
        "Please select both a team and a team leader.",
        false
      );
      return;
    }

    if (customerIds.has(selectedUserId)) {
      setMessage(
        leaderMessage,
        "This user is already assigned as a customer.",
        false
      );
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Assigning...";
    leaderMessage.textContent = "";

    try {
      const { data, error } = await sgecoreSupabase.rpc(
        "sde_assign_team_leader",
        {
          p_team_id: selectedTeamId,
          p_user_id: selectedUserId
        }
      );

      if (error) throw error;

      if (data && data.success === false) {
        throw new Error("The team leader could not be assigned.");
      }

      setMessage(
        leaderMessage,
        "Team leader assigned successfully.",
        true
      );

      userSelect.value = "";

      await loadTeams();

    } catch (error) {
      setMessage(
        leaderMessage,
        "Unable to assign team leader: " + error.message,
        false
      );
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Assign Leader";
    }
  });

  // ASSIGN CUSTOMER TO TEAM
  customerForm.addEventListener("submit", async event => {
    event.preventDefault();

    const selectedTeamId = customerTeamSelect.value;
    const selectedUserId = customerUserSelect.value;

    const submitButton =
      customerForm.querySelector('button[type="submit"]');

    if (!selectedTeamId || !selectedUserId) {
      setMessage(
        customerMessage,
        "Please select both a team and a customer.",
        false
      );
      return;
    }

    if (
      memberships.some(member =>
        member.user_id === selectedUserId &&
        member.member_role === "team_leader" &&
        member.is_active !== false
      )
    ) {
      setMessage(
        customerMessage,
        "A team leader cannot be assigned as a customer.",
        false
      );
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Assigning...";
    customerMessage.textContent = "";

    try {
      const { data, error } = await sgecoreSupabase.rpc(
        "sde_assign_team_customer",
        {
          p_team_id: selectedTeamId,
          p_user_id: selectedUserId
        }
      );

      if (error) throw error;

      if (data && data.success === false) {
        throw new Error("The customer could not be assigned.");
      }

      setMessage(
        customerMessage,
        "Customer assigned successfully.",
        true
      );

      customerUserSelect.value = "";

      await loadTeams();

    } catch (error) {
      setMessage(
        customerMessage,
        "Unable to assign customer: " + error.message,
        false
      );
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Assign Customer";
    }
  });

  // REFRESH DATA
  wrapper.querySelector("#sdeRefreshTeams")
    .addEventListener("click", async () => {
      await loadTeams();
    });

  await loadTeams();
}

    
async function renderTeamTrade() {
  const settingsCard = el("div", undefined, "card");
  settingsCard.append(el("h2", "Team Trade Control"));
  settingsCard.append(el(
    "p",
    "Configure win percentages for explicitly authorized internal team accounts. A percentage controls the approximate win rate over time. Accounts without an enabled setting continue using normal market-price settlement.",
    "muted"
  ));

  // Load customer profiles for searching and displaying customer details.
  const profiles = await query(
    "profiles",
    "id,member_id,full_name,email",
    { order: "created_at", limit: 1000 }
  );

  const profileById = new Map(
    profiles.map(profile => [profile.id, profile])
  );

  let selectedCustomer = null;

  // Customer search
  const searchInput = el("input");
  searchInput.type = "search";
  searchInput.placeholder = "Search by 5-digit Member ID, name or email";
  searchInput.autocomplete = "off";
  searchInput.style.width = "100%";

  const customerSelect = el("select");
  customerSelect.style.width = "100%";

  const selectedDetails = el("div", undefined, "notice");
  selectedDetails.textContent = "No customer selected.";

  function showSelectedCustomer(profile) {
    selectedCustomer = profile || null;
    clear(selectedDetails);

    if (!profile) {
      selectedDetails.textContent = "No customer selected.";
      return;
    }

    selectedDetails.append(el("h3", "Selected Customer"));

    const details = el("div", undefined, "detail-list");

    [
      ["Member ID", profile.member_id || "Unavailable"],
      ["Name", profile.full_name || "Not available"],
      ["Email", profile.email || "Not available"]
    ].forEach(([label, value]) => {
      details.append(el("strong", label));
      details.append(el("span", value));
    });

    selectedDetails.append(details);
  }

  function updateCustomerResults() {
    const search = searchInput.value.trim().toLowerCase();

    customerSelect.replaceChildren();

    const placeholder = el("option", "Select a customer");
    placeholder.value = "";
    customerSelect.append(placeholder);

    if (!search) {
      customerSelect.disabled = true;
      return;
    }

    const matches = profiles.filter(profile =>
      [
        profile.member_id,
        profile.full_name,
        profile.email
      ].some(value =>
        String(value || "").toLowerCase().includes(search)
      )
    ).slice(0, 50);

    matches.forEach(profile => {
      const memberId = profile.member_id || "No Member ID";
      const name = profile.full_name || "Unnamed customer";
      const email = profile.email || "No email";

      const option = el(
        "option",
        memberId + " — " + name + " (" + email + ")"
      );

      option.value = profile.id;
      customerSelect.append(option);
    });

    customerSelect.disabled = matches.length === 0;

    if (!matches.length) {
      const noResults = el("option", "No matching customers found");
      noResults.value = "";
      customerSelect.append(noResults);
    }
  }

  searchInput.addEventListener("input", () => {
    showSelectedCustomer(null);
    updateCustomerResults();
  });

  customerSelect.addEventListener("change", () => {
    const profile = profileById.get(customerSelect.value);
    showSelectedCustomer(profile);
  });

  const percentageInput = el("input");
  percentageInput.type = "number";
  percentageInput.min = "0";
  percentageInput.max = "100";
  percentageInput.step = "0.01";
  percentageInput.value = "50";
  percentageInput.style.width = "100%";

  const enabledInput = el("input");
  enabledInput.type = "checkbox";
  enabledInput.checked = true;

  const status = el("div", "", "message");

  const listCard = el("div", undefined, "card");
  listCard.append(el("h2", "Configured Team Accounts"));

  const listContent = el("div");
  listCard.append(listContent);

  async function loadTeamTradeSettings() {
    listContent.replaceChildren(
      el("div", "Loading team account settings...", "loading")
    );

    const { data, error } = await sgecoreSupabase.rpc(
      "get_sge_team_trade_controls"
    );

    if (error) throw error;

    const rows = Array.isArray(data) ? data : [];

    // Resolve UUIDs internally to customer profiles.
    const missingIds = rows
      .filter(item => !profileById.has(item.user_id))
      .map(item => item.user_id)
      .filter(Boolean);

    if (missingIds.length) {
      const extraProfiles = await query(
        "profiles",
        "id,member_id,full_name,email",
        { in: ["id", missingIds], limit: 1000 }
      );

      extraProfiles.forEach(profile => {
        profileById.set(profile.id, profile);
      });
    }

    const resultTable = table(
      [
        "Member ID",
        "Customer Name",
        "Email",
        "Win Percentage",
        "Status",
        "Last Updated",
        "Action"
      ],
      rows,
      item => {
        const profile = profileById.get(item.user_id);

        const memberId = profile?.member_id || "Unavailable";
        const customerName = profile?.full_name || "Customer unavailable";
        const email = profile?.email || "Unavailable";

        const actionCell = el("td");

        actionCell.append(button("Edit", () => {
          if (!profile) {
            status.textContent =
              "Customer profile could not be found. Settings cannot be edited.";
            status.className = "message error";
            return;
          }

          searchInput.value =
            profile.member_id || profile.full_name || profile.email || "";

          updateCustomerResults();
          customerSelect.value = profile.id;

          showSelectedCustomer(profile);

          percentageInput.value = item.win_percentage;
          enabledInput.checked = item.enabled === true;

          status.textContent =
            "Account settings loaded. Make your changes and save.";
          status.className = "message";
        }));

        return tr([
          memberId,
          customerName,
          email,
          Number(item.win_percentage).toFixed(2) + "%",
          item.enabled ? "Enabled" : "Disabled",
          date(item.updated_at),
          actionCell
        ]);
      }
    );

    listContent.replaceChildren(resultTable);
  }

  const saveButton = button("Save Team Trade Settings", async () => {
    if (!selectedCustomer) {
      status.textContent = "Search for and select a customer first.";
      status.className = "message error";
      return;
    }

    const percentage = Number(percentageInput.value);

    if (
      percentageInput.value.trim() === "" ||
      !Number.isFinite(percentage) ||
      percentage < 0 ||
      percentage > 100
    ) {
      status.textContent = "Win percentage must be between 0 and 100.";
      status.className = "message error";
      return;
    }

    saveButton.disabled = true;
    status.textContent = "Saving settings...";
    status.className = "message";

    try {
      const { error } = await sgecoreSupabase.rpc(
        "set_sge_team_trade_control",
        {
          p_user_id: selectedCustomer.id,
          p_enabled: enabledInput.checked,
          p_win_percentage: percentage
        }
      );

      if (error) throw error;

      status.textContent =
        "Team trade settings saved successfully.";
      status.className = "message success";

      await loadTeamTradeSettings();

    } catch (e) {
      status.textContent =
        e.message || "Unable to save settings.";
      status.className = "message error";

    } finally {
      saveButton.disabled = false;
    }
  }, "primary");

  settingsCard.append(
    el("label", "Search Customer (5-digit Member ID, Name or Email)"),
    searchInput,
    el("label", "Matching Customers"),
    customerSelect,
    selectedDetails,
    el("label", "Win Percentage (0–100)"),
    percentageInput,
    el("label", "Enable settings for this account"),
    enabledInput,
    saveButton,
    status
  );

  content.append(settingsCard, listCard);

  await loadTeamTradeSettings();
}

async function renderCustomerLabels() {
  const [labels, profiles, memberships] = await Promise.all([
    query("support_customer_labels", "id,name,color,created_at,updated_at", {
      order: "created_at",
      limit: 500
    }),
    query("profiles", "id,member_id,full_name,email", {
      order: "created_at",
      limit: 500
    }),
    query("support_customer_label_members", "label_id,user_id,created_at", {
      limit: 5000
    })
  ]);

  const profileById = new Map(profiles.map(p => [p.id, p]));

  const selectedId = labels.some(
    label => label.id === state.customerLabelSelectedId
  )
    ? state.customerLabelSelectedId
    : (labels[0]?.id || null);

  state.customerLabelSelectedId = selectedId;

  // Create a new label
  const createCard = el("div", undefined, "card");
  createCard.append(el("h2", "Create a customer label"));
  createCard.append(el(
    "p",
    "Create private categories such as Deposit Clients, Potential Clients, VIP Clients or Fellows. Only administrators can see these labels.",
    "muted"
  ));

  const createName = el("input");
  createName.type = "text";
  createName.maxLength = 50;
  createName.placeholder = "Enter label name (e.g. Deposit Clients)";

  const createColor = el("input");
  createColor.type = "color";
  createColor.value = "#d9b45b";
  createColor.style.width = "75px";
  createColor.style.height = "42px";
  createColor.style.padding = "4px";

  const createStatus = el("div", "", "message");

  const createButton = button("Create label", async () => {
    const name = createName.value.trim();

    if (!name) {
      createStatus.textContent = "Enter a label name.";
      createStatus.className = "message error";
      return;
    }

    createButton.disabled = true;
    createStatus.textContent = "Creating label...";
    createStatus.className = "message";

    try {
      const { data, error } = await sgecoreSupabase
        .from("support_customer_labels")
        .insert({
          name,
          color: createColor.value,
          created_by: state.user.id
        })
        .select("id")
        .single();

      if (error) throw error;

      state.customerLabelSelectedId = data.id;
      await loadPage("customerlabels");

    } catch (e) {
      createStatus.textContent = e.message;
      createStatus.className = "message error";
    } finally {
      createButton.disabled = false;
    }
  }, "primary");

  const createRow = el("div", undefined, "toolbar");
  createRow.append(createColor, createName, createButton);
  createCard.append(createRow, createStatus);
  content.append(createCard);

  // Existing labels
  const listCard = el("div", undefined, "card");
  listCard.append(el("h2", "Your customer labels"));

  const labelRows = labels.map(label => {
    const count = memberships.filter(
      member => member.label_id === label.id
    ).length;

    return {
      label,
      count
    };
  });

  content.append(listCard);

  if (!labelRows.length) {
    listCard.append(el(
      "div",
      "No labels created yet. Create your first label above.",
      "empty"
    ));
    return;
  }

  listCard.append(table(
    ["Label", "Customers", "Created", "Actions"],
    labelRows,
    item => {
      const swatch = el("span");
      swatch.style.cssText =
        "display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:" +
        item.label.color;

      const labelName = el("span");
      labelName.append(swatch, el("strong", item.label.name));

      return tr([
        labelName,
        item.count,
        date(item.label.created_at),
        actions(
          button("Manage", () => {
            state.customerLabelSelectedId = item.label.id;
            loadPage("customerlabels");
          }, "primary")
        )
      ]);
    }
  ));

  // Selected label management
  const selectedLabel = labels.find(label => label.id === selectedId);
  if (!selectedLabel) return;

  const manageCard = el("div", undefined, "card");
  manageCard.append(el("h2", "Manage: " + selectedLabel.name));
  manageCard.append(el(
    "p",
    "Edit this label or assign customers. A customer can belong to multiple labels.",
    "muted"
  ));

  const editName = el("input");
  editName.type = "text";
  editName.maxLength = 50;
  editName.value = selectedLabel.name;

  const editColor = el("input");
  editColor.type = "color";
  editColor.value = selectedLabel.color || "#d9b45b";
  editColor.style.width = "75px";
  editColor.style.height = "42px";
  editColor.style.padding = "4px";

  const editStatus = el("div", "", "message");

  const saveButton = button("Save label changes", async () => {
    const name = editName.value.trim();

    if (!name) {
      editStatus.textContent = "Label name cannot be empty.";
      editStatus.className = "message error";
      return;
    }

    saveButton.disabled = true;

    try {
      const { error } = await sgecoreSupabase
        .from("support_customer_labels")
        .update({
          name,
          color: editColor.value,
          updated_at: new Date().toISOString()
        })
        .eq("id", selectedLabel.id);

      if (error) throw error;

      await loadPage("customerlabels");

    } catch (e) {
      editStatus.textContent = e.message;
      editStatus.className = "message error";
    } finally {
      saveButton.disabled = false;
    }
  }, "primary");

  const deleteButton = button("Delete label", async () => {
    const confirmed = confirm(
      "Delete the label '" + selectedLabel.name +
      "'? Its customer assignments will also be deleted. Customer accounts will not be affected."
    );

    if (!confirmed) return;

    deleteButton.disabled = true;

    try {
      const { error } = await sgecoreSupabase
        .from("support_customer_labels")
        .delete()
        .eq("id", selectedLabel.id);

      if (error) throw error;

      state.customerLabelSelectedId = null;
      await loadPage("customerlabels");

    } catch (e) {
      editStatus.textContent = e.message;
      editStatus.className = "message error";
    } finally {
      deleteButton.disabled = false;
    }
  }, "danger");

  const editRow = el("div", undefined, "toolbar");
  editRow.append(editColor, editName, saveButton, deleteButton);
  manageCard.append(editRow, editStatus);

  // Customer assignment
  manageCard.append(el("h3", "Assign a customer"));

  const assignedIds = new Set(
    memberships
      .filter(member => member.label_id === selectedLabel.id)
      .map(member => member.user_id)
  );

  const customerSearch = el("input");
  customerSearch.type = "search";
  customerSearch.placeholder = "Search by Member ID, name or email";

  const customerSelect = el("select");
  customerSelect.style.width = "100%";

  function populateLabelCustomers(term = "") {
    const q = term.trim().toLowerCase();
    const previous = customerSelect.value;

    customerSelect.replaceChildren();

    const placeholder = el("option", "Select a customer...");
    placeholder.value = "";
    customerSelect.append(placeholder);

    profiles
      .filter(profile => {
        if (assignedIds.has(profile.id)) return false;

        return !q || [
          profile.member_id,
          profile.full_name,
          profile.email,
          profile.id
        ].some(value =>
          String(value || "").toLowerCase().includes(q)
        );
      })
      .forEach(profile => {
        const optionText = [
          profile.member_id || shortId(profile.id),
          profile.full_name || "Unnamed customer",
          profile.email
        ].filter(Boolean).join(" · ");

        const option = el("option", optionText);
        option.value = profile.id;
        customerSelect.append(option);
      });

    if (previous && [...customerSelect.options].some(
      option => option.value === previous
    )) {
      customerSelect.value = previous;
    }
  }

  customerSearch.addEventListener("input", () => {
    populateLabelCustomers(customerSearch.value);
  });

  populateLabelCustomers();

  const assignStatus = el("div", "", "message");

  const assignButton = button("Add customer to label", async () => {

async function loadAutoReplies() {
    autoRepliesList.replaceChildren();
    autoRepliesStatus.textContent = "Loading automatic replies...";

    const { data, error } = await sgecoreSupabase
        .from("support_auto_replies")
        .select("*")
        .order("priority", { ascending: true })
        .order("name", { ascending: true });

    if (error) {
        console.error("Load automatic replies:", error);
        autoRepliesStatus.textContent = "Could not load automatic replies: " + error.message;
        return;
    }

    autoRepliesCache = data || [];
    autoRepliesStatus.textContent = autoRepliesCache.length
        ? autoRepliesCache.length + " replies configured"
        : "No automatic replies have been added yet.";

    if (!autoRepliesCache.length) return;

    autoRepliesCache.forEach(reply => {
        const item = el("div", "", "");
        item.style.cssText = "background:#101f32;border:1px solid #263a52;border-radius:8px;padding:11px 12px;";

        const top = el("div", "", "");
        top.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;";

        const name = el("div", reply.name, "");
        name.style.cssText = "font-size:13px;font-weight:700;color:#f0d58c;";

        const status = el(
            "span",
            reply.is_default ? "DEFAULT" : (reply.enabled ? "ENABLED" : "DISABLED"),
            ""
        );
        status.style.cssText = "font-size:10px;font-weight:700;letter-spacing:.4px;padding:4px 7px;border-radius:5px;background:" +
            (reply.is_default ? "#59451e" : (reply.enabled ? "#173c32" : "#45252b")) +
            ";color:" + (reply.is_default ? "#f0d58c" : (reply.enabled ? "#8fe0b8" : "#f0a3a9")) + ";";

        top.append(name, status);
        item.append(top);

        const keywordText = reply.keywords && reply.keywords.length
            ? reply.keywords.join(", ")
            : "No keywords — used as fallback";
        const details = el(
            "div",
            "Priority: " + reply.priority + "  •  " + keywordText,
            ""
        );
        details.style.cssText = "font-size:11px;color:#9eacc0;margin-top:6px;line-height:1.5;";
        item.append(details);

        const actions = el("div", "", "");
        actions.style.cssText = "display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;";

        actions.append(button("Edit", () => {
            autoReplyEditingId = reply.id;
            autoReplyName.value = reply.name || "";
            autoReplyKeywords.value = (reply.keywords || []).join(", ");
            autoReplyResponse.value = reply.response || "";
            autoReplyPriority.value = reply.priority || 10;
            autoReplyEnabled.checked = !!reply.enabled;
            autoReplyDefault.checked = !!reply.is_default;
            autoReplyFormTitle.textContent = "Edit Automatic Reply";
            autoReplyForm.style.display = "block";
            autoReplyForm.scrollIntoView({ behavior: "smooth", block: "nearest" });
            autoReplyName.focus();
        }, ""));

        actions.append(button(reply.enabled ? "Disable" : "Enable", async () => {
            if (reply.is_default && reply.enabled) {
                alert("Choose and save another Default Reply before disabling this one.");
                return;
            }

            const { error: updateError } = await sgecoreSupabase
                .from("support_auto_replies")
                .update({
                    enabled: !reply.enabled,
                    updated_at: new Date().toISOString()
                })
                .eq("id", reply.id);

            if (updateError) {
                alert("Could not update this reply: " + updateError.message);
                return;
            }

            await loadAutoReplies();
        }, ""));

        actions.append(button("Delete", async () => {
            if (reply.is_default) {
                alert("The Default Reply cannot be deleted. Edit it or set another reply as default first.");
                return;
            }

            if (!confirm('Delete the automatic reply "' + reply.name + '"?')) return;

            const { error: deleteError } = await sgecoreSupabase
                .from("support_auto_replies")
                .delete()
                .eq("id", reply.id);

            if (deleteError) {
                alert("Could not delete this reply: " + deleteError.message);
                return;
            }

            await loadAutoReplies();
        }, ""));

        item.append(actions);
        autoRepliesList.append(item);
    });
}

async function renderTicketLabels(ticket) {
  const [labels, memberships] = await Promise.all([
    query(
      "support_customer_labels",
      "id,name,color",
      { order: "name", limit: 500 }
    ),
    query(
      "support_customer_label_members",
      "label_id,user_id,created_at",
      { eq: ["user_id", ticket.user_id], limit: 500 }
    )
  ]);

  const assignedIds = new Set(
    memberships.map(item => item.label_id)
  );

  const panel = el("div", undefined, "card");
  panel.append(el("h2", "Customer Labels"));

  panel.append(el(
    "p",
    "These labels are private admin notes. Customers cannot see them. You can assign multiple labels to this customer.",
    "muted"
  ));

  const labelList = el("div");
  labelList.style.cssText =
    "display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px;";

  if (!labels.length) {
    labelList.append(el(
      "div",
      "No labels created yet. Create one below.",
      "muted small"
    ));
  }

  labels.forEach(label => {
    const item = el("label");
    item.style.cssText = [
      "display:inline-flex",
      "align-items:center",
      "gap:8px",
      "padding:9px 12px",
      "border:1px solid " + (label.color || "#d9b45b"),
      "border-radius:20px",
      "background:#091626",
      "cursor:pointer",
      "margin:0"
    ].join(";");

    const checkbox = el("input");
    checkbox.type = "checkbox";
    checkbox.checked = assignedIds.has(label.id);
    checkbox.style.cssText =
      "width:auto;margin:0;accent-color:#d9b45b;";

    const dot = el("span");
    dot.style.cssText =
      "width:10px;height:10px;border-radius:50%;background:" +
      (label.color || "#d9b45b");

    const name = el("span", label.name);
    name.style.color = "var(--text)";

    checkbox.addEventListener("change", async () => {
      checkbox.disabled = true;

      try {
        if (checkbox.checked) {
          const { error } = await sgecoreSupabase
            .from("support_customer_label_members")
            .insert({
              label_id: label.id,
              user_id: ticket.user_id
            });

          if (error) throw error;

          assignedIds.add(label.id);
        } else {
          const { error } = await sgecoreSupabase
            .from("support_customer_label_members")
            .delete()
            .eq("label_id", label.id)
            .eq("user_id", ticket.user_id);

          if (error) throw error;

          assignedIds.delete(label.id);
        }

        message(
          "globalMessage",
          checkbox.checked
            ? "Label assigned to customer."
            : "Label removed from customer.",
          "success"
        );

      } catch (e) {
        checkbox.checked = !checkbox.checked;
        message("globalMessage", e.message, "error");
      } finally {
        checkbox.disabled = false;
      }
    });

    item.append(checkbox, dot, name);
    labelList.append(item);
  });

  panel.append(labelList);

  const createHeading = el("h3", "Create a new label");
  panel.append(createHeading);

  const createRow = el("div", undefined, "toolbar");

  const nameInput = el("input");
  nameInput.type = "text";
