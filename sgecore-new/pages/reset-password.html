<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Reset Password | SDE CORE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #07111f;
      color: #f4f6fa;
      font-family: Arial, sans-serif;
    }

    .reset-card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      border: 1px solid rgba(217,180,93,.3);
      border-radius: 14px;
      background: #0d1a2b;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .brand img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      color: #f0d58c;
      font-size: 25px;
    }

    .intro {
      margin: 0 0 28px;
      color: #aeb9c9;
      text-align: center;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      color: #e5eaf2;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #34445a;
      border-radius: 7px;
      outline: none;
      background: #07111f;
      color: #fff;
      font-size: 14px;
    }

    input:focus {
      border-color: #d9b45d;
    }

    .submit-button {
      width: 100%;
      min-height: 46px;
      margin-top: 24px;
      border: 1px solid #d9b45d;
      border-radius: 7px;
      background: #d9b45d;
      color: #07111f;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      color: #f0d58c;
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      color: #d9b45d;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }

    [hidden] {
      display: none !important;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
</head>

<body>
  <main class="reset-card">
    <a class="brand" href="../index.html">
      <img src="../assets/images/sde-mining-logo.png" alt="SDE CORE">
    </a>

    <h1>Reset Your Password</h1>

    <p class="intro">
      Enter your new password below to regain access to your SDE CORE account.
    </p>

    <div id="checking-message" class="message" role="status">
      Verifying your password reset link...
    </div>

    <form id="reset-form" hidden>
      <label for="new-password">New Password</label>
      <input
        type="password"
        id="new-password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Enter new password"
      >

      <label for="confirm-password">Confirm New Password</label>
      <input
        type="password"
        id="confirm-password"
        autocomplete="new-password"
        minlength="8"
        required
        placeholder="Confirm new password"
      >

      <button class="submit-button" id="reset-submit" type="submit">
        Update Password
      </button>
    </form>

    <p id="reset-message" class="message" role="status" aria-live="polite"></p>

    <a class="back-link" href="login.html">Back to Login</a>
  </main>

  <script>
    (() => {
      "use strict";

      const form = document.getElementById("reset-form");
      const checkingMessage = document.getElementById("checking-message");
      const message = document.getElementById("reset-message");
      const submitButton = document.getElementById("reset-submit");

      let recoverySessionReady = false;

      function showResetForm() {
        recoverySessionReady = true;
        checkingMessage.hidden = true;
        form.hidden = false;
      }

      if (
        typeof sgecoreSupabase === "undefined" ||
        !sgecoreSupabase.auth
      ) {
        checkingMessage.textContent =
          "Unable to load the security service. Please refresh this page.";
        return;
      }

      sgecoreSupabase.auth.onAuthStateChange((event, session) => {
        if (event === "PASSWORD_RECOVERY" && session) {
          showResetForm();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!recoverySessionReady) {
          message.textContent =
            "Your recovery link has not been verified. Please use the latest email link.";
          return;
        }

        const password =
          document.getElementById("new-password").value;

        const confirmation =
          document.getElementById("confirm-password").value;

        message.textContent = "";

        if (password.length < 8) {
          message.textContent =
            "Your password must contain at least 8 characters.";
          return;
        }

        if (password !== confirmation) {
          message.textContent = "The passwords do not match.";
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Updating...";

        try {
          const { error } = await sgecoreSupabase.auth.updateUser({
            password: password
          });

          if (error) throw error;

          recoverySessionReady = false;
          form.hidden = true;

          message.textContent =
            "Your password has been updated successfully. Redirecting to login...";

          await sgecoreSupabase.auth.signOut();

          setTimeout(() => {
            window.location.replace("login.html?password-reset=success");
          }, 1800);

        } catch (error) {
          console.error("Password update error:", error);
          message.textContent =
            error.message || "Unable to update your password. Please try again.";

          submitButton.disabled = false;
          submitButton.textContent = "Update Password";
        }
      });

      (async () => {
        try {
          const { error } = await sgecoreSupabase.auth.getSession();

          if (error) throw error;

          if (!recoverySessionReady) {
            checkingMessage.textContent =
              "This reset link is invalid or expired. Please request a new password reset email.";
          }
        } catch (error) {
          console.error("Recovery session error:", error);
          checkingMessage.textContent =
            "Unable to verify this link. Please request a new reset email.";
        }
      })();
    })();
  </script>
</body>
</html>
