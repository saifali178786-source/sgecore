
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Login | SDE CORE</title>
  <link rel="stylesheet" href="../css/style.css">

  <style>
    /* Basic login page */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #07111f;
      color: #f5f7fb;
    }

    .login-wrap {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 60px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      box-sizing: border-box;
      padding: 38px;
      border: 1px solid rgba(217, 180, 93, .35);
      background: #0d1a2b;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
    }

    .login-card h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .login-intro {
      color: #aeb9ca;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .login-card label {
      display: block;
      margin: 18px 0 8px;
      color: #e8edf5;
    }

    .login-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #344359;
      border-radius: 4px;
      background: #07111f;
      color: #fff;
      font: inherit;
    }

    .login-card input:focus {
      outline: 2px solid #d9b45d;
      outline-offset: 2px;
    }

    .login-submit,
    .google-submit {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-submit {
      margin-top: 25px;
      border: 0;
      background: #d9b45d;
      color: #07111f;
    }

    .login-submit:hover {
      background: #f0d58c;
    }

    .login-submit:disabled,
    .google-submit:disabled {
      cursor: wait;
      opacity: .7;
    }

    .google-submit {
      margin-top: 14px;
      border: 1px solid #344359;
      background: #14243a;
      color: #f5f7fb;
    }

    .google-submit:hover {
      background: #1a2e48;
    }

    .login-note {
      margin-top: 22px;
      text-align: center;
      color: #aeb9ca;
      line-height: 1.8;
    }

    .login-note a {
      color: #f0d58c;
    }

    .login-brand {
      display: block;
      margin-bottom: 26px;
      color: #d9b45d;
      font-weight: 800;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .login-message {
      margin-top: 16px;
      color: #f0d58c;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 25px 20px;
      }
    }
  </style>

  <style>
    /* Mining plans */
    .investment-section{background:#091321;color:#f5f7fb}
    .investment-section .section-heading{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:32px}
    .investment-section .section-heading h2 span{color:#e8b84d}
    .investment-count{display:inline-block;padding:10px 14px;border:1px solid rgba(232,184,77,.35);border-radius:6px;color:#e8b84d;font-size:11px;letter-spacing:1px;white-space:nowrap}
    .investment-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:stretch}
    .investment-card{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden;background:#101a28;border:1px solid rgba(190,204,224,.14);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);transition:transform .22s ease,border-color .22s ease}
    .investment-card:hover{transform:translateY(-4px);border-color:rgba(232,184,77,.55)}
    .investment-card-featured{border-color:rgba(232,184,77,.4)}
    .investment-card-premium{background:linear-gradient(145deg,#142235,#0d1725)}
    .investment-card-editorial .investment-content{border-top:2px solid rgba(232,184,77,.65)}
    .investment-image{position:relative;height:190px!important;flex:0 0 190px;overflow:hidden;background:#182537}
    .investment-image:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,11,20,.88),rgba(5,11,20,.05) 75%);pointer-events:none}
    .investment-image img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .45s ease}
    .investment-card:hover .investment-image img{transform:scale(1.045)}
    .investment-location{position:absolute;z-index:1;left:16px;bottom:14px;color:#fff;font-size:11px;font-weight:600;text-shadow:0 1px 5px #000}
    .investment-content{display:flex;flex:1;flex-direction:column;padding:20px!important}
    .plan-number{display:inline-block;margin-bottom:8px;color:#e8b84d;font-size:10px;font-weight:700;letter-spacing:1.3px}
    .investment-card-premium .plan-number{color:#f3cf7c}
    .investment-content h3{min-height:2.7em;margin:0 0 10px;color:#fff;font-size:19px;line-height:1.35}
    .daily-rate{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px;color:#a9b9cf;font-size:12px}
    .daily-rate strong{padding:5px 9px;border:1px solid rgba(232,184,77,.4);border-radius:5px;background:rgba(232,184,77,.08);color:#f4c75f;font-size:12px}
    .investment-section .investment-card .investment-content .plan-details{display:flex!important;flex-direction:column!important;align-items:stretch!important;width:100%!important;box-sizing:border-box!important;gap:0!important;margin:0 0 18px!important;padding:10px 12px!important;border:1px solid rgba(190,204,224,.16)!important;border-radius:8px!important;background:rgba(4,12,22,.42)!important}
    .investment-section .investment-card .investment-content .plan-details>div{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;align-items:center!important;width:100%!important;min-width:0!important;box-sizing:border-box!important;gap:14px!important;padding:11px 2px!important;margin:0!important;border:0!important;border-bottom:1px solid rgba(190,204,224,.10)!important}
    .investment-section .investment-card .investment-content .plan-details>div:last-child{border-bottom:0!important}
    .investment-section .investment-card .investment-content .plan-details dt{min-width:0!important;margin:0!important;color:#aebbd0!important;font-size:12px!important;line-height:1.5!important}
    .investment-section .investment-card .investment-content .plan-details dd{min-width:max-content!important;margin:0!important;color:#fff!important;font-size:13px!important;font-weight:700!important;line-height:1.5!important;text-align:right!important;white-space:nowrap!important}
    .investment-description{min-height:3.6em;margin:0 0 15px;color:#a9b9cf;font-size:12px;line-height:1.65}
    .investment-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
    .investment-button{display:flex;width:100%;justify-content:center;align-items:center;text-align:center;text-decoration:none;box-sizing:border-box;cursor:pointer}
    .investment-actions .button{min-width:0;padding:12px 8px;font-size:12px}
    .investment-actions .view-more{display:flex;align-items:center;justify-content:center;border:1px solid rgba(232,184,77,.42);border-radius:6px;background:rgba(232,184,77,.06);color:#f0d58c;text-decoration:none;font-weight:700}
    .investment-actions .view-more:hover{background:rgba(232,184,77,.14)}
    .investment-disclaimer{margin:24px 0 0;color:#94a5bb;font-size:12px;line-height:1.8}
    .investment-disclaimer strong{color:#e8b84d}
    @media(max-width:1000px){.investment-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:600px){.investment-grid{grid-template-columns:1fr}.investment-section .section-heading{align-items:flex-start;flex-direction:column}.investment-image{height:200px!important;flex-basis:200px}.investment-content h3{font-size:18px}}
    @media(max-width:380px){.investment-section .investment-card .investment-content .plan-details{padding:8px 10px!important}.investment-section .investment-card .investment-content .plan-details>div{gap:8px!important}.investment-section .investment-card .investment-content .plan-details dt{font-size:11px!important}.investment-section .investment-card .investment-content .plan-details dd{font-size:12px!important}}

    /* Market ticker */
    .market-ticker{background:#030914;border-top:1px solid rgba(232,184,77,.18);border-bottom:1px solid rgba(232,184,77,.28);overflow:hidden;color:#aebbd0}
    .ticker-track{max-width:none;min-height:48px;margin:auto;padding:0 clamp(14px,2.5vw,36px);display:flex;align-items:center;justify-content:flex-start;gap:25px;white-space:nowrap;overflow-x:auto;scrollbar-width:none}
    .ticker-track::-webkit-scrollbar{display:none}
    .ticker-track>span{flex:0 0 auto;font-size:11px;color:#b7c3d4}
    .ticker-track strong{display:inline-block;margin-left:6px;color:#fff;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
    .ticker-track small{margin-left:5px;color:#899bb2;font-size:10px}
    .ticker-track em{margin-left:5px;color:#65dba4;font-size:10px;font-style:normal}
    .ticker-track em.down{color:#ff8585}
    .ticker-label{color:#e8b84d!important;font-weight:800;letter-spacing:.12em!important}
    .ticker-refresh{color:#7e91a9!important;font-size:10px!important}

    /* Hero */
    .hero-inner{align-items:center}
    .hero-copy{max-width:760px}
    .hero-copy h1{max-width:780px;font-size:clamp(42px,6.2vw,76px);line-height:1.04;letter-spacing:-.045em}
    .hero-copy h1 span{color:#e8b84d}
    .hero-gold-card{width:min(100%,340px);padding:28px;border:1px solid rgba(232,184,77,.38);border-radius:14px;background:linear-gradient(145deg,rgba(20,32,49,.96),rgba(7,17,31,.96));box-shadow:0 24px 70px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
    .gold-card-eyebrow,.gold-card-symbol,.gold-card-unit,.gold-card-updated{display:block}
    .gold-card-eyebrow{color:#dcb55d;font-size:10px;font-weight:800;letter-spacing:.15em}
    .gold-card-symbol{margin-top:7px;color:#aebbd0;font-size:12px}
    .hero-gold-card>strong{display:block;margin:9px 0 2px;color:#fff;font-size:clamp(28px,3vw,38px);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
    .gold-card-unit{color:#9eafc5;font-size:11px;line-height:1.6}
    .gold-card-divider{height:1px;margin:20px 0;background:rgba(190,204,224,.16)}
    .hero-gold-card .gold-gram-price{margin:7px 0 2px;color:#e8b84d;font-size:28px}
    .gold-card-updated{margin-top:15px;color:#8e9eb4;font-size:10px}

    /* Market snapshot */
    .market-heading-new{align-items:end}
    .snapshot-panel{overflow:hidden;border:1px solid rgba(190,204,224,.14);border-radius:14px;background:linear-gradient(145deg,#101b2a,#0a1421);box-shadow:0 16px 40px rgba(0,0,0,.14)}
    .snapshot-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 24px;border-bottom:1px solid rgba(190,204,224,.12)}
    .snapshot-toolbar strong,.snapshot-toolbar span{display:block}
    .snapshot-toolbar strong{color:#f5f7fb;font-size:16px}
    .snapshot-toolbar div span,.snapshot-toolbar>span{margin-top:5px;color:#92a3ba;font-size:11px}
    .snapshot-scroll{overflow-x:auto}
    .snapshot-table{width:100%;min-width:720px;border-collapse:collapse;text-align:left}
    .snapshot-table th{padding:15px 20px;color:#8294ab;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    .snapshot-table td{padding:15px 20px;border-top:1px solid rgba(190,204,224,.09);color:#e9edf4;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
    .snapshot-table tbody tr:hover{background:rgba(220,181,93,.035)}
    .snapshot-asset{display:flex;align-items:center;gap:12px}
    .snapshot-asset>span:last-child strong,.snapshot-asset small{display:block}
    .snapshot-asset strong{color:#f4f6fa;font-size:12px}
    .snapshot-asset small{margin-top:4px;color:#8496ad;font-size:10px}
    .snapshot-coin{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(220,181,93,.2);border-radius:50%;background:rgba(220,181,93,.08);color:#e8b84d;font-size:16px}
    .snapshot-coin.gold-coin{font-size:12px}
    .snapshot-table .muted-cell{color:#718198;font-size:11px}
    .snapshot-table .positive{color:#4bd69a}
    .snapshot-table .negative{color:#ff8585}
    .sparkline{width:110px;height:32px;overflow:visible}
    .sparkline path{fill:none;stroke:#dcb55d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .sparkline.negative path{stroke:#ff8585}
    .snapshot-footnote{padding:14px 22px;border-top:1px solid rgba(190,204,224,.1);color:#8192a8;font-size:10px;line-height:1.7}
    .market-disclaimer{margin-top:18px}

    /* Why SDE Core */
    .why-section{background:#081321;color:#f5f7fb}
    .why-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
    .why-card{position:relative;min-height:230px;padding:24px;border:1px solid rgba(190,204,224,.13);border-radius:12px;background:linear-gradient(145deg,#111e2e,#0b1522);transition:transform .2s ease,border-color .2s ease}
    .why-card:hover{transform:translateY(-4px);border-color:rgba(232,184,77,.45)}
    .why-number{position:absolute;top:20px;right:20px;color:#6f8096;font-size:10px;letter-spacing:.12em}
    .why-icon{display:grid;place-items:center;width:44px;height:44px;margin-bottom:24px;border:1px solid rgba(232,184,77,.28);border-radius:10px;background:rgba(232,184,77,.08);color:#e8b84d;font-size:22px}
    .why-card h3{margin:0 0 10px;color:#f4f6fa;font-size:17px}
    .why-card p{margin:0;color:#9eafc5;font-size:12px;line-height:1.8}

    /* Crypto cards */
    .crypto-market-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:34px 0 18px}
    .crypto-market-heading h3{margin:8px 0 0;color:#f5f7fb;font-size:clamp(20px,2.4vw,28px)}
    .crypto-market-heading h3 span{color:#e8b84d}
    .crypto-updated{color:#9eafc5;font-size:12px}
    .crypto-market-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
    .crypto-market-card{min-width:0;padding:18px;border:1px solid rgba(190,204,224,.14);border-radius:10px;background:linear-gradient(145deg,#101a28,#0b1522);transition:border-color .2s ease,transform .2s ease}
    .crypto-market-card:hover{transform:translateY(-3px);border-color:rgba(232,184,77,.45)}
    .crypto-market-top{display:flex;align-items:center;gap:11px;margin-bottom:20px}
    .crypto-coin-icon{display:flex;align-items:center;justify-content:center;flex:0 0 38px;width:38px;height:38px;border-radius:50%;background:rgba(232,184,77,.1);color:#e8b84d;font-size:20px;font-weight:700}
    .crypto-market-top h4{margin:0 0 4px;color:#f5f7fb;font-size:14px}
    .crypto-market-top div span{color:#9eafc5;font-size:11px}
    .crypto-price{overflow-wrap:anywhere;color:#f5f7fb;font-size:clamp(19px,2vw,25px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
    .crypto-change{display:inline-flex;margin-top:9px;padding:5px 8px;border-radius:5px;background:rgba(148,163,184,.09);color:#9eafc5;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
    .crypto-change.positive{background:rgba(45,190,125,.12);color:#4bd69a}
    .crypto-change.negative{background:rgba(244,86,86,.12);color:#ff8585}
    .crypto-change.neutral{background:rgba(148,163,184,.09);color:#9eafc5}
    .market-status{display:flex;align-items:center;gap:8px;color:#9eafc5;font-size:12px}
    .market-status.is-live{color:#4bd69a}
    .market-status.is-error{color:#ff8585}

    /* Account dropdown */
    .sge-account-menu{position:relative}
    .sge-account-trigger{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid rgba(217,180,93,.42);border-radius:8px;background:rgba(217,180,93,.08);color:#f5f7fb;cursor:pointer;font:inherit}
    .sge-account-avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#d9b45d;color:#07111f;font-size:12px}
    .sge-account-label{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
    .sge-account-label strong{font-size:13px}
    .sge-account-label small{max-width:145px;color:#d9b45d;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sge-account-chevron{color:#d9b45d}
    .sge-account-dropdown{position:absolute;z-index:1000;top:calc(100% + 9px);right:0;min-width:190px;padding:7px;border:1px solid rgba(217,180,93,.28);border-radius:10px;background:#0b1726;box-shadow:0 14px 35px rgba(0,0,0,.35)}
    .sge-account-dropdown a,.sge-account-dropdown button{display:block;width:100%;padding:11px 12px;border:0;border-radius:6px;background:transparent;color:#eaf0f8;text-align:left;text-decoration:none;font:inherit;font-size:13px;cursor:pointer;box-sizing:border-box}
    .sge-account-dropdown a:hover,.sge-account-dropdown button:hover{background:rgba(217,180,93,.12);color:#f0d58c}
    .sge-account-dropdown button{border-top:1px solid rgba(255,255,255,.09);margin-top:4px;color:#f0d58c}
    [hidden]{display:none!important}

    /* Desktop header alignment */
    @media(min-width:900px){
      header.site-header{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:0!important;min-height:88px;padding:14px clamp(22px,3.5vw,58px)!important;box-sizing:border-box}
      header.site-header>.brand{display:inline-flex;align-items:center;flex:0 0 auto;margin:0!important}
      header.site-header>.brand .brand-mark{width:42px;height:42px;display:grid;place-items:center;font-size:15px}
      header.site-header>.brand .brand-copy strong{font-size:18px}
      header.site-header>.brand .brand-copy small{font-size:9px;letter-spacing:.13em}
      header.site-header>.menu-toggle{display:none!important}
      header.site-header>.main-nav{position:static!important;inset:auto!important;display:flex!important;flex:1 1 auto;align-items:center!important;justify-content:flex-start!important;gap:clamp(17px,2vw,30px)!important;width:auto!important;margin:0 24px 0 clamp(28px,4vw,62px)!important;padding:0!important;transform:none!important}
      header.site-header>.main-nav a{display:inline-flex;align-items:center;min-height:42px;font-size:14px!important;font-weight:600;white-space:nowrap}
      header.site-header>.header-actions{display:flex!important;flex:0 0 auto;align-items:center!important;justify-content:flex-end!important;gap:12px;margin:0 0 0 auto!important}
      .sge-account-trigger{min-height:46px;padding:8px 15px!important;gap:11px!important}
      .sge-account-avatar{width:32px!important;height:32px!important;font-size:14px!important}
      .sge-account-label strong{font-size:14px!important}
      .sge-account-label small{max-width:155px;font-size:11px!important}
      header.site-header{padding-top:8px!important;padding-bottom:8px!important;min-height:70px!important}
    }
    @media(min-width:900px) and (max-width:1120px){
      header.site-header>.main-nav{gap:13px!important;margin-left:22px!important;margin-right:14px!important}
      header.site-header>.main-nav a{font-size:12px!important}
      header.site-header>.brand .brand-copy small{font-size:8px}
    }
    @media(max-width:900px){.ticker-track{justify-content:flex-start}.hero-inner{gap:28px}.hero-gold-card{width:280px;padding:22px}.why-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:760px){.sge-account-dropdown{right:0}}
    @media(max-width:650px){
      .hero-inner{align-items:flex-start;flex-direction:column}
      .hero-gold-card{width:100%;box-sizing:border-box;max-width:390px}
      .hero-copy h1{font-size:clamp(38px,11vw,58px)}
      .ticker-track{padding:0 16px;gap:22px}
      .snapshot-toolbar{align-items:flex-start;flex-direction:column;padding:18px}
      .why-grid{grid-template-columns:1fr}
      .why-card{min-height:0}
      .crypto-market-heading{align-items:flex-start;flex-direction:column}
      .crypto-market-grid{grid-template-columns:1fr}
      .crypto-market-card{padding:16px}
      .snapshot-table th,.snapshot-table td{padding:13px 14px}
    }
  </style>

  <style>
    /* SDE CORE - FINAL HOMEPAGE HEADER */
    @media (min-width: 900px) {
      header.site-header > .main-nav {
        justify-content: flex-start !important;
        gap: clamp(11px, 1.45vw, 20px) !important;
      }

      header.site-header > .main-nav > a {
        font-size: 13px !important;
      }

      header.site-header > .main-nav > .header-actions {
        margin-left: auto !important;
      }

      header.site-header #sge-account-menu {
        margin-left: auto !important;
      }

      header.site-header .sge-account-trigger,
      header.site-header .login-btn,
      header.site-header .register-btn {
        min-height: 40px !important;
        padding: 0 17px !important;
        border: 1px solid rgba(217,180,93,.75) !important;
        border-radius: 7px !important;
        font-size: 13px !important;
        font-weight: 700 !important;
        box-sizing: border-box !important;
      }
    }
  </style>

  <style>
    /* SDE CORE PREMIUM AUTHENTICATION DESIGN */

    .login-wrap,
    .register-wrap {
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(217,180,93,.10), transparent 38%),
        radial-gradient(ellipse at 85% 85%, rgba(36,83,125,.18), transparent 42%),
        #07111f;

  <!-- Supabase libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth-ui.js"></script>

  <!-- Email and password login -->
  <script>
    (() => {
      "use strict";

      const loginForm = document.getElementById("login-form");
      const loginMessage = document.getElementById("login-message");
      const loginButton = document.getElementById("login-submit");

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (loginButton.disabled) return;

        loginMessage.textContent = "";

        if (
          typeof sgecoreSupabase === "undefined" ||
          !sgecoreSupabase.auth
        ) {
          loginMessage.textContent =
            "Supabase could not be loaded. Check your connection file and internet connection.";
          return;
        }

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        loginButton.disabled = true;
        loginButton.textContent = "Signing in...";

        try {
          const { data, error } =
            await sgecoreSupabase.auth.signInWithPassword({
              email,
              password
            });

          if (error) {
            loginMessage.textContent = error.message;
            return;
          }

          if (data.user) {
            loginMessage.textContent =
              "Login successful! Opening your dashboard...";

            const selectedPlan =
              new URLSearchParams(window.location.search).get("plan");

            window.location.href = selectedPlan
              ? "mining.html?plan=" + encodeURIComponent(selectedPlan)
              : "dashboard.html";
          } else {
            loginMessage.textContent =
              "Sign-in could not be completed. Please try again.";
          }
        } catch (error) {
          console.error("Login error:", error);

          loginMessage.textContent =
            "Unable to connect to Supabase. Check your internet connection and try again.";
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = "Login";
        }
      });
    })();
  </script>
